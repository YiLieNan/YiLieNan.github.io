};


    // ═══════════════════════════════════════════
    //  筛选：先圈范围，再让食神在范围里抽
    // ═══════════════════════════════════════════
    const CATEGORIES = ['早餐经典', '面食江湖', '米饭正餐', '硬菜盛宴', '快餐小吃', '沙拉轻食', '甜品饮品'];
    const DIETS = [
      { key: 'noSpicy', label: '不吃辣' },
      { key: 'veg', label: '只吃素' },
      { key: 'cheap', label: '省着点' }
    ];

    // 把标签合并进食物数据，缺省的按「可辣、含肉、正常价」处理
    FOOD_DATABASE.forEach(f => {
      const t = FOOD_TAGS[f.id] || [1, 0, 2];
      f.spicy = t[0];
      f.veg = t[1];
      f.price = t[2];
    });

    el.chips = document.getElementById('chips');
    el.dietChips = document.getElementById('dietChips');
    el.filterCount = document.getElementById('filterCount');

    function defaultFilters() {
      return { cats: [], noSpicy: false, veg: false, cheap: false };
    }

    function poolOf(filters) {
      const f = filters || defaultFilters();
      const cats = Array.isArray(f.cats) ? f.cats : [];

      let pool = cats.length
        ? FOOD_DATABASE.filter(x => cats.includes(x.category))
        : FOOD_DATABASE.slice();

      if (f.noSpicy) pool = pool.filter(x => x.spicy === 0);
      if (f.veg) pool = pool.filter(x => x.veg === 1);
      if (f.cheap) pool = pool.filter(x => x.price === 1);

      return pool;
    }

    // 覆盖原版：抽签只从当前筛选池里取
    function randomFood(excludeId) {
      const base = poolOf(state.filters);
      let cand = excludeId ? base.filter(f => f.id !== excludeId) : base;
      if (!cand.length) cand = base;
      return cand[Math.floor(Math.random() * cand.length)];
    }

    // 覆盖原版：把筛选条件一起存下来
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          daily: state.daily,
          history: state.history,
          rejects: state.rejects,
          sound: state.sound,
          filters: state.filters
        }));
      } catch (e) { /* 无痕模式下忽略 */ }
    }

    function loadFilters() {
      const d = defaultFilters();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (Array.isArray(saved.filters)) {
          // 旧版只存了分类数组
          d.cats = saved.filters.filter(c => CATEGORIES.includes(c));
        } else if (saved.filters && typeof saved.filters === 'object') {
          d.cats = Array.isArray(saved.filters.cats)
            ? saved.filters.cats.filter(c => CATEGORIES.includes(c))
            : [];
          d.noSpicy = !!saved.filters.noSpicy;
          d.veg = !!saved.filters.veg;
          d.cheap = !!saved.filters.cheap;
        }
      } catch (e) { /* 存储损坏时回到默认 */ }
      return d;
    }

    function activeFilterCount() {
      const f = state.filters;
      return (Array.isArray(f.cats) ? f.cats.length : 0) +
        (f.noSpicy ? 1 : 0) + (f.veg ? 1 : 0) + (f.cheap ? 1 : 0);
    }

    function buildFilterChips() {
      if (!el.chips || !el.dietChips) return;
      el.chips.innerHTML = '';
      el.dietChips.innerHTML = '';

      const makeCat = (label, cat) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.dataset.cat = cat;
        b.textContent = label;
        b.addEventListener('click', () => {
          if (!cat) {
            state.filters.cats = [];
          } else {
            const i = state.filters.cats.indexOf(cat);
            if (i >= 0) state.filters.cats.splice(i, 1);
            else state.filters.cats.push(cat);
          }
          saveState();
          syncFilters();
        });
        return b;
      };

      el.chips.appendChild(makeCat('不限', ''));
      CATEGORIES.forEach(c => el.chips.appendChild(makeCat(c, c)));

      DIETS.forEach(diet => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.dataset.diet = diet.key;
        b.textContent = diet.label;
        b.addEventListener('click', () => {
          state.filters[diet.key] = !state.filters[diet.key];
          saveState();
          syncFilters();
        });
        el.dietChips.appendChild(b);
      });
    }

    function syncFilters() {
      if (!el.chips || !el.dietChips) return;

      el.chips.querySelectorAll('.chip').forEach(b => {
        const cat = b.dataset.cat;
        const on = cat ? state.filters.cats.includes(cat) : state.filters.cats.length === 0;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });

      el.dietChips.querySelectorAll('.chip').forEach(b => {
        const on = !!state.filters[b.dataset.diet];
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });

      const n = poolOf(state.filters).length;
      const parts = [];
      if (state.filters.cats.length) parts.push(state.filters.cats.length + ' 类');
      const dietN = (state.filters.noSpicy ? 1 : 0) + (state.filters.veg ? 1 : 0) + (state.filters.cheap ? 1 : 0);
      if (dietN) parts.push(dietN + ' 个忌口');

      if (el.filterCount) {
        el.filterCount.textContent = parts.length
          ? parts.join(' + ') + ' · ' + n + ' 道'
          : '全部 ' + n + ' 道';
      }

      if (el.empty && !el.empty.hidden) {
        const big = el.empty.querySelector('.big');
        if (big) {
          big.textContent = parts.length ? '筛完还剩 ' + n + ' 道' : '签筒里备着一百道菜';
        }
      }
    }

    state.filters = loadFilters();
    buildFilterChips();
    syncFilters();


    // ═══════════════════════════════════════════
    //  打卡评价：吃了就记一笔
    // ═══════════════════════════════════════════
    const RATING_LABEL = { good: '好吃', meh: '一般', bad: '踩雷' };
    const RATING_TOAST = {
      good: '记住了，这道菜进你的常点清单。',
      meh: '一般。神下次少推它。',
      bad: '踩雷了。神记仇，下次绕开。'
    };

    el.ratingBar = document.getElementById('ratingBar');
    el.ratingOptions = document.getElementById('ratingOptions');
    el.ratingDone = document.getElementById('ratingDone');

    function findRatingItem() {
      if (!state.current) return null;
      const same = state.history.filter(h => h.id === state.current.id && h.accepted);
      return same.find(h => !h.rating) || same[0] || null;
    }

    function renderRatingBar() {
      if (!el.ratingBar) return;
      if (!state.current || !state.current.accepted) {
        el.ratingBar.hidden = true;
        return;
      }
      el.ratingBar.hidden = false;
      const item = findRatingItem();
      if (item && item.rating) {
        if (el.ratingOptions) el.ratingOptions.hidden = true;
        if (el.ratingDone) {
          el.ratingDone.hidden = false;
          el.ratingDone.textContent = '记下了：' + RATING_LABEL[item.rating];
        }
      } else {
        if (el.ratingOptions) el.ratingOptions.hidden = false;
        if (el.ratingDone) el.ratingDone.hidden = true;
      }
    }

    function rateCurrent(rating) {
      const item = findRatingItem();
      if (!item) {
        // 极端情况下历史里没有这条，补一条
        state.history.unshift({
          id: state.current.id,
          name: state.current.name,
          icon: state.current.icon,
          ts: Date.now(),
          accepted: true,
          rating: rating
        });
      } else {
        item.rating = rating;
      }
      saveState();
      renderRatingBar();
      renderLog();
      showToast(RATING_TOAST[rating]);
    }

    if (el.ratingOptions) {
      el.ratingOptions.querySelectorAll('.rate-btn').forEach(b => {
        b.addEventListener('click', () => rateCurrent(b.dataset.r));
      });
    }

    // 采纳后（印章 class 变化）同步评价条
    if (el.stamp) {
      new MutationObserver(() => renderRatingBar())
        .observe(el.stamp, { attributes: true, attributeFilter: ['class'] });
    }
    el.accept.addEventListener('click', () => setTimeout(renderRatingBar, 0));

    // 覆盖原版：求签簿里显示评价，并支持补评
    function renderLog() {
      if (!el.logList) return;
      if (!state.history.length) {
        el.logList.innerHTML = '<li class="log-empty">还没有求过签。</li>';
        return;
      }
      const p = n => String(n).padStart(2, '0');
      el.logList.innerHTML = state.history.map((item, i) => {
        const t = new Date(item.ts);
        const time = `${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
        const rating = item.rating ? RATING_LABEL[item.rating] : '';
        const tag = item.accepted ? (rating || '吃了') : '没吃';
        const canRate = item.accepted && !item.rating;
        return `<li class="log-item">
          <span class="log-icon">${item.icon}</span>
          <span class="log-name">${item.name}</span>
          <span class="log-tag ${item.accepted ? 'accepted' : ''}">${tag}</span>
          ${canRate ? `<button class="log-rate" type="button" data-i="${i}">评一下</button>` : ''}
          <span class="log-time">${time}</span>
        </li>`;
      }).join('');

      el.logList.querySelectorAll('.log-rate').forEach(b => {
        b.addEventListener('click', () => openRateSheet(Number(b.dataset.i)));
      });
    }

    function openRateSheet(i) {
      const item = state.history[i];
      const li = el.logList.querySelectorAll('.log-item')[i];
      if (!item || !li) return;
      li.innerHTML = `<span class="log-icon">${item.icon}</span>
        <span class="log-name">${item.name}</span>
        <span class="inline-rate">
          <button type="button" data-r="good">好吃</button>
          <button type="button" data-r="meh">一般</button>
          <button type="button" data-r="bad">踩雷</button>
        </span>`;
      li.querySelectorAll('.inline-rate button').forEach(b => {
        b.addEventListener('click', () => {
          item.rating = b.dataset.r;
          saveState();
          renderLog();
          showToast(RATING_TOAST[b.dataset.r]);
        });
      });
    }

    renderRatingBar();
    renderLog();


    // ═══════════════════════════════════════════
    //  食神的脾气：心情滤镜 / 名号 / 记仇本
    // ═══════════════════════════════════════════
    const NAME_KEY = 'food_oracle_name';
    const SIN_KEY = 'food_oracle_sins';

    el.moodPrefix = document.getElementById('moodPrefix');
    el.nameBtn = document.getElementById('nameBtn');
    el.sinBtn = document.getElementById('sinBtn');
    el.sinCount = document.getElementById('sinCount');
    el.nameDrawer = document.getElementById('nameDrawer');
    el.nameClose = document.getElementById('nameClose');
    el.nameNote = document.getElementById('nameNote');
    el.nameInput = document.getElementById('nameInput');
    el.nameSend = document.getElementById('nameSend');
    el.sinDrawer = document.getElementById('sinDrawer');
    el.sinClose = document.getElementById('sinClose');
    el.sinList = document.getElementById('sinList');

    function loadName() {
      try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
    }

    function saveName(v) {
      try { localStorage.setItem(NAME_KEY, v); } catch (e) { }
    }

    function loadSins() {
      try {
        const a = JSON.parse(localStorage.getItem(SIN_KEY) || '[]');
        return Array.isArray(a) ? a : [];
      } catch (e) {
        return [];
      }
    }

    function saveSins() {
      try {
        localStorage.setItem(SIN_KEY, JSON.stringify(state.sins.slice(0, 50)));
      } catch (e) { }
    }

    function hasGoodToday() {
      const today = new Date().toDateString();
      return state.history.some(h => h.rating === 'good' && new Date(h.ts).toDateString() === today);
    }

    function effectiveMood(food) {
      const base = moodOfDay();
      const call = state.godName ? state.godName + '，' : '';
      let mood;

      if (state.rejects >= 3) {
        mood = {
          key: 'grumpy',
          line: call + '你今天已经换了 ' + state.rejects + ' 次。神把勺子放下了，自己看着办。',
          prefix: '先说好，神今天没耐心。' + (food && food.angry_bonus ? ' ' + food.angry_bonus : ''),
          stamp: '神很烦'
        };
      } else if (hasGoodToday()) {
        mood = {
          key: 'happy',
          line: call + '你上次说好吃，神今天心情不错，给你挑个稳的。',
          prefix: '',
          stamp: '神准了'
        };
      } else {
        const lines = {
          calm: call + '神今天心情不错，给你挑个稳的。',
          grumpy: base.line,
          low: base.line,
          chuuni: base.line
        };
        const prefixes = {
          calm: '',
          grumpy: food && food.angry_bonus ? food.angry_bonus : '神今天脾气不太好。',
          low: '（神今天不太想说话，但还是给你解了。）',
          chuuni: '哼，凡人，这就是你的宿命之食。'
        };
        const stamps = { calm: '天意', grumpy: '神很烦', low: '神也emo', chuuni: '天命难违' };
        mood = {
          key: base.key,
          line: lines[base.key] || '',
          prefix: prefixes[base.key] || '',
          stamp: stamps[base.key] || '天意'
        };
      }

      if (periodNow() === 'night') {
        mood.line += '（这个点还没睡？）';
        mood.prefix = (mood.prefix ? mood.prefix + ' ' : '') + '夜审：这个点吃饭，胃会记你一笔。';
      }

      return mood;
    }

    function updateNameBtn() {
      if (!el.nameBtn) return;
      el.nameBtn.textContent = state.godName
        ? '神记得你：' + state.godName
        : '神还没记住你的名号';
    }

    function openName() {
      if (!el.nameDrawer) return;
      el.nameInput.value = state.godName || '';
      el.nameNote.textContent = state.godName
        ? '「' + state.godName + '」——神认得你。想换个名号吗？'
        : '留个名号，神会记住你。不必是真名。';
      el.nameDrawer.classList.add('open');
      setTimeout(() => el.nameInput.focus(), 150);
    }

    function sendName() {
      const v = el.nameInput.value.trim();
      if (!v) {
        showToast('不写名号？神怎么记住你。');
        return;
      }
      state.godName = v.slice(0, 12);
      saveName(state.godName);
      updateNameBtn();
      el.nameDrawer.classList.remove('open');
      showToast('「' + state.godName + '」——神记住了。下次来，会认出你。', 3200);

      if (state.current && el.stage && !el.stage.hidden) {
        const mood = effectiveMood(state.current);
        el.moodLine.textContent = mood.line;
        el.moodLine.hidden = !mood.line;
      }
    }

    function renderSins() {
      if (!el.sinList) return;
      el.sinCount.textContent = String(state.sins.length);
      el.sinBtn.setAttribute('aria-label', '记仇小本本，共 ' + state.sins.length + ' 条');

      if (!state.sins.length) {
        el.sinList.innerHTML = '<li class="sin-empty">本子是空的。你暂时还是个良民。</li>';
        return;
      }

      const p = n => String(n).padStart(2, '0');
      el.sinList.innerHTML = state.sins.map((s, i) => {
        const t = new Date(s.ts);
        const time = p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes());
        const food = byId(s.id);
        return '<li class="sin-item">' +
          '<button class="sin-row" type="button" data-i="' + i + '">' +
          '<span>' + s.icon + ' 拒了「' + s.name + '」</span>' +
          '<span class="sin-time">' + time + '</span>' +
          '</button>' +
          (food ? '<p class="sin-verdict" hidden>' + food.angry_bonus + '</p>' : '') +
          '</li>';
      }).join('');

      el.sinList.querySelectorAll('.sin-row').forEach(row => {
        row.addEventListener('click', () => {
          const v = row.nextElementSibling;
          if (v && v.classList.contains('sin-verdict')) v.hidden = !v.hidden;
        });
      });
    }

    let _pendingReject = null;
    document.addEventListener('click', e => {
      if (e.target && e.target.closest && e.target.closest('#againBtn')) {
        _pendingReject = state.current;
      }
    }, true);

    function addSin(food) {
      if (!food) return;
      state.sins.unshift({
        id: food.id,
        name: food.name,
        icon: food.icon,
        ts: Date.now()
      });
      state.sins = state.sins.slice(0, 50);
      saveSins();
      renderSins();

      const n = state.sins.length;
      let line = '';
      if (n === 3) line = '三条了。神翻了翻小本本，没说话。';
      else if (n === 5) line = '五条了。神开始怀疑你是不是来砸场子的。';
      else if (n === 8) line = '八条。神把小本本合上了，说随你。';
      if (line) setTimeout(() => showToast(line, 3200), 900);
    }

    // 注册在 bind 之前：拿到的是被拒的旧签
    el.again.addEventListener('click', () => {
      if (_pendingReject) addSin(_pendingReject);
      _pendingReject = null;
    });

    if (el.nameBtn) el.nameBtn.addEventListener('click', openName);
    if (el.nameClose) el.nameClose.addEventListener('click', () => el.nameDrawer.classList.remove('open'));
    if (el.nameDrawer) el.nameDrawer.addEventListener('click', e => {
      if (e.target === el.nameDrawer) el.nameDrawer.classList.remove('open');
    });
    if (el.nameSend) el.nameSend.addEventListener('click', sendName);
    if (el.nameInput) el.nameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendName();
    });

    if (el.sinBtn) el.sinBtn.addEventListener('click', () => {
      renderSins();
      el.sinDrawer.classList.add('open');
    });
    if (el.sinClose) el.sinClose.addEventListener('click', () => el.sinDrawer.classList.remove('open'));
    if (el.sinDrawer) el.sinDrawer.addEventListener('click', e => {
      if (e.target === el.sinDrawer) el.sinDrawer.classList.remove('open');
    });

    state.godName = loadName();
    state.sins = loadSins();
    updateNameBtn();
    renderSins();


    // ═══════════════════════════════════════════
    //  口味档案 + 本周小结
    // ═══════════════════════════════════════════
    const STREAK_KEY = 'food_oracle_streak';

    el.profileBtn = document.getElementById('profileBtn');
    el.profileDrawer = document.getElementById('profileDrawer');
    el.profileClose = document.getElementById('profileClose');
    el.profileBody = document.getElementById('profileBody');
    el.weeklyBtn = document.getElementById('weeklyBtn');

    function touchStreak() {
      const today = dateKey();
      let s = { last: null, days: 0 };
      try {
        s = JSON.parse(localStorage.getItem(STREAK_KEY) || 'null') || s;
      } catch (e) { }

      if (s.last === today) {
        state.streak = s.days || 1;
        return;
      }

      const yesterday = dateKey(new Date(Date.now() - 86400000));
      s.days = s.last === yesterday ? (s.days || 0) + 1 : 1;
      s.last = today;
      try { localStorage.setItem(STREAK_KEY, JSON.stringify(s)); } catch (e) { }
      state.streak = s.days;
    }

    function tallyCats(list) {
      const cats = {};
      list.forEach(x => {
        const food = byId(x.id);
        if (food) cats[food.category] = (cats[food.category] || 0) + 1;
      });
      return Object.entries(cats).sort((a, b) => b[1] - a[1]);
    }

    function profileStats() {
      const h = state.history;
      const accepted = h.filter(x => x.accepted);
      const rated = accepted.filter(x => x.rating);
      const good = rated.filter(x => x.rating === 'good').length;
      const bad = rated.filter(x => x.rating === 'bad').length;
      return {
        draws: h.length,
        accepted: accepted.length,
        rated: rated.length,
        good: good,
        bad: bad,
        goodRate: rated.length ? Math.round(good / rated.length * 100) : null,
        topCats: tallyCats(accepted).slice(0, 2),
        unique: new Set(accepted.map(x => x.id)).size,
        streak: state.streak || 0
      };
    }

    function weeklyStats() {
      const cut = Date.now() - 7 * 86400000;
      const recent = state.history.filter(h => h.ts >= cut);
      const accepted = recent.filter(x => x.accepted);
      const rated = accepted.filter(x => x.rating);
      const good = rated.filter(x => x.rating === 'good').length;
      const bad = rated.filter(x => x.rating === 'bad').length;
      return {
        draws: recent.length,
        accepted: accepted.length,
        rated: rated.length,
        good: good,
        bad: bad,
        goodRate: rated.length ? Math.round(good / rated.length * 100) : null,
        topCats: tallyCats(accepted).slice(0, 3)
      };
    }

    function weeklyLine(s) {
      if (!s.rated) return '这周还没给过评价，神不知道你满不满意。';
      if (s.bad >= 2) return '踩了 ' + s.bad + ' 次雷，你的嘴比胃挑。';
      if (s.goodRate >= 80) return '这周吃得挺满意，神的推荐没白给。';
      if (s.topCats.length) return '这周你主要吃' + s.topCats[0][0] + '，换来换去还是那几样。';
      return '吃得不多，但都在点上。';
    }

    function renderProfile() {
      if (!el.profileBody) return;
      const s = profileStats();

      if (!s.draws) {
        el.profileBody.innerHTML = '<div class="profile-empty">还没求过签。<br>先摇两次，再来看看你的口味。</div>';
        if (el.weeklyBtn) el.weeklyBtn.disabled = true;
        return;
      }

      const rateText = s.goodRate === null ? '—' : s.goodRate + '%';
      const topLine = s.topCats.length
        ? '最常吃：' + s.topCats.map(c => c[0] + ' ' + c[1] + ' 次').join(' · ')
        : '还没正经吃过几顿。';

      el.profileBody.innerHTML = `
        <div class="profile-grid">
          <div class="profile-stat"><b>${s.draws}</b><span>次求签</span></div>
          <div class="profile-stat"><b>${s.accepted}</b><span>顿吃了</span></div>
          <div class="profile-stat"><b>${rateText}</b><span>好评率</span></div>
          <div class="profile-stat"><b>${s.streak}</b><span>连续天数</span></div>
        </div>
        <div class="profile-line">${topLine}</div>
        <div class="profile-line">吃过 ${s.unique} 种不同的菜${s.bad ? '，踩雷 ' + s.bad + ' 次' : ''}。</div>
      `;
      if (el.weeklyBtn) el.weeklyBtn.disabled = false;
    }

    function openProfile() {
      renderProfile();
      el.profileDrawer.classList.add('open');
    }

    el.profileBtn.addEventListener('click', openProfile);
    el.profileClose.addEventListener('click', () => el.profileDrawer.classList.remove('open'));
    el.profileDrawer.addEventListener('click', e => {
      if (e.target === el.profileDrawer) el.profileDrawer.classList.remove('open');
    });

    function drawWeekly(s) {
      const W = 1080;
      const H = 1560;
      const paper = { x: 56, y: 92, w: 968, h: 1290 };
      const inner = paper.x + 44;
      const p = n => String(n).padStart(2, '0');

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffd84d';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(17,17,17,.16)';
      for (let py = 12; py < H; py += 24) {
        for (let px = 12; px < W; px += 24) {
          ctx.beginPath();
          ctx.arc(px, py, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.fillStyle = '#111111';
      ctx.fillRect(paper.x + 16, paper.y + 16, paper.w, paper.h);
      ctx.fillStyle = '#fffdf5';
      ctx.fillRect(paper.x, paper.y, paper.w, paper.h);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 10;
      ctx.strokeRect(paper.x, paper.y, paper.w, paper.h);

      // 标题
      ctx.fillStyle = '#111111';
      ctx.textAlign = 'left';
      ctx.font = '900 78px "Arial Black","Microsoft YaHei",sans-serif';
      ctx.fillText('本周口味', inner, 208);

      const now = new Date();
      const start = new Date(Date.now() - 6 * 86400000);
      ctx.fillStyle = 'rgba(17,17,17,.6)';
      ctx.font = '900 22px "Courier New",monospace';
      ctx.fillText(
        start.getFullYear() + '.' + p(start.getMonth() + 1) + '.' + p(start.getDate()) +
        ' — ' + now.getFullYear() + '.' + p(now.getMonth() + 1) + '.' + p(now.getDate()),
        inner, 254
      );

      // 分隔
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(inner, 292);
      ctx.lineTo(paper.x + paper.w - 44, 292);
      ctx.stroke();

      // 四个数字
      const items = [
        [String(s.draws), '求签'],
        [String(s.accepted), '吃了'],
        [s.goodRate === null ? '—' : s.goodRate + '%', '好评率'],
        [String(s.bad), '踩雷']
      ];
      const colW = (paper.w - 88) / 4;
      items.forEach((item, i) => {
        const x = inner + i * colW;
        const size = String(item[0]).length > 3 ? 62 : 82;
        ctx.fillStyle = '#111111';
        ctx.font = '900 ' + size + 'px "Arial Black","Microsoft YaHei",sans-serif';
        ctx.fillText(item[0], x, 420);
        ctx.fillStyle = 'rgba(17,17,17,.6)';
        ctx.font = '900 22px "Microsoft YaHei",sans-serif';
        ctx.fillText(item[1], x, 458);
      });

      // 分类排行
      ctx.fillStyle = '#111111';
      ctx.font = '900 28px "Microsoft YaHei",sans-serif';
      ctx.fillText('这周主要吃', inner, 560);

      const maxN = s.topCats.length ? s.topCats[0][1] : 1;
      s.topCats.forEach((item, i) => {
        const y = 606 + i * 96;
        ctx.fillStyle = '#111111';
        ctx.font = '900 26px "Microsoft YaHei",sans-serif';
        ctx.fillText(item[0], inner, y + 30);

        const barX = inner + 260;
        const barMax = 520;
        const barW = Math.max(70, Math.round(barMax * item[1] / maxN));
        ctx.fillStyle = i === 0 ? '#ff4d2e' : (i === 1 ? '#23c9a0' : '#ff8f7a');
        ctx.fillRect(barX, y, barW, 40);
        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 3;
        ctx.strokeRect(barX, y, barW, 40);

        ctx.fillStyle = '#111111';
        ctx.font = '900 24px "Courier New",monospace';
        ctx.fillText(item[1] + ' 次', barX + barW + 14, y + 29);
      });

      if (!s.topCats.length) {
        ctx.fillStyle = 'rgba(17,17,17,.55)';
        ctx.font = '700 24px "Microsoft YaHei",sans-serif';
        ctx.fillText('还没吃过什么，神不好总结。', inner, 640);
      }

      // 一句话
      ctx.fillStyle = '#111111';
      ctx.fillRect(inner, 930, 150, 36);
      ctx.fillStyle = '#fffdf5';
      ctx.font = '900 20px "Microsoft YaHei",sans-serif';
      ctx.fillText('食神批注', inner + 14, 956);

      ctx.fillStyle = '#111111';
      ctx.font = '500 34px "PingFang SC","Microsoft YaHei",sans-serif';
      wrapText(ctx, weeklyLine(s), inner, 1020, paper.w - 88, 56);

      // 印章
      ctx.save();
      ctx.translate(paper.x + paper.w - 118, paper.y + paper.h - 150);
      ctx.rotate(-9 * Math.PI / 180);
      ctx.strokeStyle = '#ff4d2e';
      ctx.lineWidth = 7;
      ctx.strokeRect(-58, -64, 116, 128);
      ctx.fillStyle = '#ff4d2e';
      ctx.textAlign = 'center';
      ctx.font = '900 46px "Arial Black","Microsoft YaHei",sans-serif';
      ctx.fillText('本', 0, -6);
      ctx.fillText('周', 0, 52);
      ctx.restore();

      // 底部
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(17,17,17,.6)';
      ctx.font = '900 20px "Courier New",monospace';
      ctx.fillText('yileina.cyou/tools/food-oracle', inner, paper.y + paper.h - 30);

      canvas.toBlob(blob => {
        if (!blob) { showToast('生成图片失败，试试直接截图。'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '本周口味.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('小结图存好了，发出去馋人。', 3000);
      }, 'image/png');
    }

    el.weeklyBtn.addEventListener('click', () => {
      const s = weeklyStats();
      if (!s.draws) {
        showToast('这周还没求过签，先摇一签。');
        return;
      }
      drawWeekly(s);
    });

    touchStreak();
    renderProfile();


    // ═══════════════════════════════════════════
    //  两个人一起摇
    // ═══════════════════════════════════════════
    el.duoStage = document.getElementById('duoStage');
    el.duoCards = document.getElementById('duoCards');
    el.duoAccept = document.getElementById('duoAccept');
    el.duoAgain = document.getElementById('duoAgain');
    el.modeBtns = document.querySelectorAll('.mode-btn');

    const MODE_KEY = 'food_oracle_mode';
    const duoState = { cards: [], picked: 0 };

    function loadMode() {
      try {
        return localStorage.getItem(MODE_KEY) === 'duo' ? 'duo' : 'solo';
      } catch (e) {
        return 'solo';
      }
    }

    function syncMode() {
      el.modeBtns.forEach(b => {
        const on = b.dataset.mode === state.mode;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });

      if (state.mode === 'duo') {
        el.stage.hidden = true;
        el.duoStage.hidden = true;
        el.empty.hidden = false;
        el.drawBtn.textContent = '摇 两 个 人 的 签';
        el.hint.textContent = '一人一签，摇完再选';
      } else {
        el.duoStage.hidden = true;
        const hasDaily = state.daily && state.daily.date === dateKey();
        el.drawBtn.textContent = hasDaily
          ? (state.daily.accepted ? '看 今 天 的 签' : '看 今 日 签')
          : '摇 一 签';
        el.hint.textContent = hasDaily ? '今天神已经给过你答案了' : '摇一摇，或者点一下';
        if (!hasDaily) el.empty.hidden = false;
      }
    }

    function setMode(mode) {
      state.mode = mode;
      try { localStorage.setItem(MODE_KEY, mode); } catch (e) { }
      syncMode();
    }

    function renderDuo() {
      const period = periodNow();
      el.duoCards.innerHTML = duoState.cards.map((f, i) => {
        const judge = f.time_judgement[period] || '';
        return `<button class="duo-card ${i === duoState.picked ? 'on' : ''}" type="button" data-i="${i}">
          <span class="duo-owner">${i === 0 ? '你 的 签' : 'TA 的 签'}</span>
          <span class="duo-icon" aria-hidden="true">${f.icon}</span>
          <span class="duo-name">${f.name}</span>
          <span class="duo-no">第 ${ticketNumber(f)} 签 · ${f.category}</span>
          <span class="duo-judge">${judge}</span>
        </button>`;
      }).join('');

      el.duoCards.querySelectorAll('.duo-card').forEach(card => {
        card.addEventListener('click', () => {
          duoState.picked = Number(card.dataset.i);
          el.duoCards.querySelectorAll('.duo-card').forEach(c => {
            c.classList.toggle('on', c === card);
          });
        });
      });
    }

    function drawDuo() {
      if (state.busy || state.mode !== 'duo') return;
      state.busy = true;
      el.drawBtn.disabled = true;
      play('shake');
      el.tube.classList.add('shaking');

      const pool = poolOf(state.filters);
      const first = pool[Math.floor(Math.random() * pool.length)];
      const rest = pool.filter(f => f.id !== first.id);
      const second = rest.length ? rest[Math.floor(Math.random() * rest.length)] : first;

      setTimeout(() => {
        el.tube.classList.remove('shaking');
        play('drop');

        duoState.cards = [first, second];
        duoState.picked = 0;
        state.current = null;

        recordHistory(first);
        if (second.id !== first.id) recordHistory(second);

        renderDuo();
        el.duoStage.hidden = false;
        el.stage.hidden = true;
        el.empty.hidden = true;
        el.duoAccept.disabled = false;
        el.duoAccept.textContent = '就这个';
        play('reveal');

        state.busy = false;
        el.drawBtn.disabled = false;
        checkDrawnHint(2);
        requestAnimationFrame(() => el.duoStage.scrollIntoView({ block: 'start' }));
      }, 560);
    }

    function checkDrawnHint(n) {
      if (state.mode !== 'duo') return;
      el.hint.textContent = n > 1 ? '签都摇完了，挑一张' : '再摇一张';
    }

    function acceptDuo() {
      const food = duoState.cards[duoState.picked];
      if (!food) return;
      const item = state.history.find(h => h.id === food.id && !h.accepted);
      if (item) item.accepted = true;
      saveState();
      renderLog();

      el.duoAccept.disabled = true;
      el.duoAccept.textContent = '已经定了';
      el.duoCards.querySelectorAll('.duo-card').forEach(c => c.classList.add('done'));
      showToast('就吃' + food.name + '。两个人别再争了。', 3200);
    }

    function interceptSolo(e) {
      if (state.mode !== 'duo') return;
      e.stopImmediatePropagation();
      e.preventDefault();
      drawDuo();
    }

    el.drawBtn.addEventListener('click', interceptSolo, true);
    el.tube.addEventListener('click', interceptSolo, true);

    el.modeBtns.forEach(b => {
      b.addEventListener('click', () => setMode(b.dataset.mode));
    });

    el.duoAccept.addEventListener('click', acceptDuo);
    el.duoAgain.addEventListener('click', drawDuo);

    state.mode = loadMode();
    setTimeout(syncMode, 0);


    init();
    console.log('%c食神签 · 一百道菜等你摇', 'color:#a92f22;font-size:14px');
  
  </script>
</body>

</html>
