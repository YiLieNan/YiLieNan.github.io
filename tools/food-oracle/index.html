<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>食神签 · 今天吃什么</title>
  <meta name="description" content="食神签：摇一摇签筒，从一百道菜里得一张后厨出的单子。今天吃什么，不用再想。">
  <meta name="theme-color" content="#ffd84d">
  <style>
    :root {
      --yellow: #ffd84d;
      --red: #ff4d2e;
      --red-deep: #d93a1f;
      --black: #111111;
      --cream: #fffdf5;
      --mint: #23c9a0;
      --pink: #ff8f7a;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --display: "Arial Black", "Microsoft YaHei", "PingFang SC", sans-serif;
      --serif: "Songti SC", "STSong", "SimSun", serif;
      --press: cubic-bezier(.2, .9, .3, 1.2);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--yellow);
      color: var(--black);
      font-family: var(--sans);
      line-height: 1.7;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    .wall {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle, rgba(17, 17, 17, .16) 1.2px, transparent 1.5px) 0 0 / 16px 16px,
        var(--yellow);
    }

    .wall::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .22), transparent 22%, transparent 82%, rgba(17, 17, 17, .07));
    }

    .counter {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 18px 18px calc(36px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── 顶部 ───────────────────────────── */
    .topbar {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand-mark {
      display: inline-block;
      background: var(--black);
      color: var(--cream);
      font-family: var(--display);
      font-size: .66rem;
      font-weight: 900;
      letter-spacing: .24em;
      padding: 5px 5px 5px 10px;
      transform: rotate(-2deg);
      user-select: none;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 4px;
    }

    .period {
      font-family: var(--display);
      font-size: .66rem;
      font-weight: 900;
      letter-spacing: .16em;
    }

    .sound-btn {
      appearance: none;
      background: none;
      border: 0;
      color: var(--black);
      font-family: inherit;
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .08em;
      padding: 4px 2px;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .sound-btn[data-on="false"] {
      opacity: .45;
    }

    /* ── 标题 ───────────────────────────── */
    .masthead {
      text-align: center;
      margin: 8px 0 0;
    }

    .masthead h1 {
      font-family: var(--display);
      font-size: clamp(2.9rem, 14vw, 3.9rem);
      font-weight: 900;
      letter-spacing: .02em;
      line-height: 1.05;
      color: var(--cream);
      -webkit-text-stroke: 4px var(--black);
      paint-order: stroke fill;
      text-shadow: 7px 7px 0 var(--black);
      transform: rotate(-1.6deg);
    }

    .masthead .sub {
      display: inline-block;
      margin-top: 14px;
      background: var(--black);
      color: var(--cream);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .04em;
      padding: 5px 10px;
      transform: rotate(1.2deg);
    }

    /* ── 模式切换 ───────────────────────── */
    .mode-switch {
      display: flex;
      margin-top: 4px;
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
    }

    .mode-btn {
      appearance: none;
      background: var(--cream);
      color: var(--black);
      border: 0;
      font-family: var(--sans);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .1em;
      padding: 7px 18px;
      cursor: pointer;
    }

    .mode-btn + .mode-btn {
      border-left: 3px solid var(--black);
    }

    .mode-btn.on {
      background: var(--black);
      color: var(--cream);
    }

    .mode-btn:focus-visible {
      outline: 3px solid var(--black);
      outline-offset: 2px;
    }

    /* ── 签筒 ───────────────────────────── */
    .oracle {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .tube-wrap {
      position: relative;
      margin: 10px 0 0;
      padding-top: 86px;
      display: flex;
      justify-content: center;
    }

    .tube {
      position: relative;
      width: 168px;
      height: 216px;
      border: 0;
      padding: 0;
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .tube:focus-visible {
      outline: 4px solid var(--black);
      outline-offset: 10px;
    }

    .tube.hint-pulse .tube-body {
      animation: tube-breathe 2.8s ease-in-out infinite;
    }

    .sticks {
      position: absolute;
      left: 50%;
      bottom: 184px;
      width: 140px;
      height: 118px;
      transform: translateX(-50%);
      z-index: 1;
      pointer-events: none;
    }

    .stick {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 9px;
      height: var(--h, 70px);
      margin-left: -4.5px;
      background: var(--cream);
      border: 2px solid var(--black);
      border-radius: 0;
      transform: translateX(var(--x, 0)) rotate(var(--r, 0deg));
      transform-origin: 50% 100%;
    }

    .stick::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      height: 14px;
      background: var(--red);
      border-bottom: 2px solid var(--black);
    }

    .stick:nth-child(5n+3)::before { background: var(--yellow); }
    .stick:nth-child(5n+5)::before { background: var(--mint); }

    .stick.fly {
      animation: stick-fly .72s var(--press) forwards;
    }

    @keyframes stick-fly {
      0% { transform: translateX(var(--x, 0)) translateY(0) rotate(var(--r, 0deg)); }
      40% { transform: translateX(var(--x, 0)) translateY(-104px) rotate(12deg); }
      100% { transform: translateX(calc(var(--x, 0px) + 34px)) translateY(-180px) rotate(64deg); opacity: 0; }
    }

    .tube-body {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 126px;
      height: 184px;
      transform: translateX(-50%) rotate(-2deg);
      background: var(--red);
      border: 5px solid var(--black);
      border-radius: 6px 6px 24px 24px;
      box-shadow: 9px 9px 0 var(--black);
      z-index: 0;
    }

    .tube-band {
      position: absolute;
      left: -5px;
      right: -5px;
      top: 42%;
      height: 34px;
      background: var(--cream);
      border-top: 5px solid var(--black);
      border-bottom: 5px solid var(--black);
      display: grid;
      place-items: center;
      font-family: var(--display);
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .3em;
      text-indent: .3em;
      z-index: 3;
    }

    .tube-mouth {
      position: absolute;
      left: 50%;
      bottom: 168px;
      width: 126px;
      height: 28px;
      transform: translateX(-50%) rotate(-2deg);
      background: var(--cream);
      border: 5px solid var(--black);
      border-radius: 50%;
      box-shadow: inset 0 7px 0 rgba(17, 17, 17, .16);
      z-index: 2;
    }

    .tube-tip {
      position: absolute;
      right: -34px;
      top: 34%;
      z-index: 4;
      background: var(--mint);
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .08em;
      white-space: nowrap;
      padding: 4px 7px;
      transform: rotate(7deg);
      pointer-events: none;
    }

    .hint {
      margin-top: 34px;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .16em;
      transition: opacity .3s;
    }

    /* ── 分类筛选 ───────────────────────── */
    .filters {
      width: 100%;
      margin-top: 30px;
    }

    .filters-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .filters-title {
      font-size: .64rem;
      font-weight: 900;
      letter-spacing: .2em;
    }

    .filters-count {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: rgba(17, 17, 17, .58);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
    }

    .diet-chips {
      margin-top: 7px;
    }

    .diet-chips .chip.on {
      background: var(--black);
      color: var(--cream);
    }

    .chip {
      appearance: none;
      background: var(--cream);
      color: var(--black);
      border: 2px solid var(--black);
      box-shadow: 3px 3px 0 var(--black);
      font-family: var(--sans);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .04em;
      padding: 6px 10px;
      cursor: pointer;
      transition: transform .08s, box-shadow .08s, background .16s, color .16s;
    }

    .chip:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--black);
    }

    .chip.on {
      background: var(--red);
      color: var(--cream);
    }

    .chip:focus-visible {
      outline: 3px solid var(--black);
      outline-offset: 2px;
    }

    .draw-btn {
      margin-top: 16px;
      appearance: none;
      background: var(--cream);
      color: var(--black);
      border: 4px solid var(--black);
      box-shadow: 6px 6px 0 var(--black);
      font-family: var(--display);
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: .26em;
      text-indent: .26em;
      padding: 13px 36px;
      cursor: pointer;
      transition: transform .08s, box-shadow .08s;
    }

    .draw-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 var(--black);
    }

    .draw-btn:focus-visible {
      outline: 4px solid var(--black);
      outline-offset: 3px;
    }

    .draw-btn:disabled {
      opacity: .5;
      cursor: default;
    }

    /* ── 空签占位 ───────────────────────── */
    .empty-note {
      width: 100%;
      margin-top: 38px;
      padding: 26px 22px;
      background:
        repeating-linear-gradient(-45deg, rgba(17, 17, 17, .05) 0 2px, transparent 2px 9px),
        var(--cream);
      border: 4px dashed var(--black);
      text-align: center;
      font-size: .78rem;
      font-weight: 700;
      line-height: 1.95;
      transform: rotate(-.5deg);
    }

    .empty-note .big {
      display: block;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }

    /* ── 签纸 ───────────────────────────── */
    .ticket-stage {
      width: 100%;
      margin-top: 40px;
      scroll-margin-top: 16px;
    }

    .ticket {
      position: relative;
      width: 100%;
      background: var(--cream);
      border: 5px solid var(--black);
      box-shadow: 12px 12px 0 var(--black);
      padding: 18px 18px 22px;
      transform: rotate(-.7deg);
    }

    .ticket.play {
      animation: ticket-out .62s var(--press) both;
    }

    @keyframes ticket-out {
      0% { clip-path: inset(100% 0 0 0); translate: 0 30px; }
      100% { clip-path: inset(0 0 0 0); translate: 0 0; }
    }

    .ticket-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .ticket-no {
      display: inline-block;
      background: var(--black);
      color: var(--cream);
      font-family: var(--display);
      font-size: .66rem;
      font-weight: 900;
      letter-spacing: .14em;
      padding: 4px 9px;
      transform: rotate(-2deg);
    }

    .ticket-cert {
      font-size: .56rem;
      font-weight: 900;
      letter-spacing: .1em;
      color: var(--red);
      border: 2px solid var(--red);
      padding: 3px 5px;
      margin-right: 46px;
      transform: rotate(6deg);
      opacity: .85;
    }

    .dish {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 0;
    }

    .dish-icon {
      font-size: 3.4rem;
      line-height: 1;
      filter: drop-shadow(3px 3px 0 rgba(17, 17, 17, .18));
    }

    .dish-text {
      min-width: 0;
    }

    .dish-name {
      display: inline-block;
      font-family: var(--display);
      font-size: clamp(2.1rem, 10vw, 2.7rem);
      font-weight: 900;
      letter-spacing: -.02em;
      line-height: 1.05;
      padding-bottom: 4px;
      border-bottom: 7px solid var(--red);
    }

    .dish-meta {
      margin-top: 9px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .1em;
    }

    .dish-meta .cat {
      border: 2px solid var(--black);
      background: var(--yellow);
      padding: 2px 6px;
      transform: rotate(-1deg);
    }

    .mood-line {
      margin-top: 14px;
      padding: 8px 10px;
      border: 3px solid var(--black);
      background: var(--cream);
      font-size: .72rem;
      font-weight: 700;
      line-height: 1.7;
      transform: rotate(.4deg);
    }

    .block {
      margin-top: 16px;
    }

    .block .label {
      display: inline-block;
      background: var(--black);
      color: var(--cream);
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: .2em;
      padding: 3px 8px;
      margin-bottom: 7px;
    }

    .block p {
      font-size: .9rem;
      line-height: 1.92;
      color: var(--black);
      text-align: justify;
    }

    .dos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .do {
      border: 3px solid var(--black);
      padding: 7px 9px;
      background: var(--mint);
    }

    .do.dont {
      background: var(--pink);
    }

    .do b {
      display: block;
      font-family: var(--display);
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .2em;
      margin-bottom: 3px;
    }

    .do span {
      font-size: .76rem;
      font-weight: 700;
      line-height: 1.65;
    }

    .ticket-foot {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 3px dashed var(--black);
    }

    .barcode {
      width: 92px;
      height: 24px;
      background: repeating-linear-gradient(90deg,
          var(--black) 0 3px, transparent 3px 6px,
          var(--black) 6px 8px, transparent 8px 12px);
      flex-shrink: 0;
    }

    .foot-meta {
      margin-right: 58px;
      text-align: right;
      font-size: .56rem;
      font-weight: 900;
      letter-spacing: .05em;
      line-height: 1.7;
    }

    .stamp {
      position: absolute;
      right: 16px;
      bottom: 14px;
      width: 50px;
      height: 60px;
      display: grid;
      place-items: center;
      border: 4px solid var(--red);
      color: var(--red);
      font-family: var(--display);
      font-size: 1.18rem;
      font-weight: 900;
      letter-spacing: .04em;
      writing-mode: vertical-rl;
      line-height: 1.1;
      transform: rotate(-9deg) scale(1.6);
      opacity: 0;
      pointer-events: none;
    }

    .stamp.down {
      animation: stamp-drop .3s var(--press) .1s forwards;
    }

    @keyframes stamp-drop {
      0% { opacity: 0; transform: rotate(-9deg) scale(1.7); }
      100% { opacity: .92; transform: rotate(-9deg) scale(1); }
    }

    .stamp.accepted {
      color: var(--mint);
      border-color: var(--mint);
      opacity: .95;
    }

    /* ── 按钮 ───────────────────────────── */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .btn {
      flex: 1;
      appearance: none;
      font-family: var(--display);
      font-size: .8rem;
      font-weight: 900;
      letter-spacing: .18em;
      text-indent: .18em;
      padding: 14px 8px;
      border: 4px solid var(--black);
      box-shadow: 6px 6px 0 var(--black);
      cursor: pointer;
      transition: transform .08s, box-shadow .08s;
    }

    .btn:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 var(--black);
    }

    .btn:focus-visible {
      outline: 4px solid var(--black);
      outline-offset: 3px;
    }

    .btn.primary {
      background: var(--red);
      color: var(--cream);
    }

    .btn.primary:disabled {
      background: var(--cream);
      color: var(--black);
      opacity: .6;
      cursor: default;
    }

    .btn.ghost {
      background: var(--cream);
      color: var(--black);
    }

    /* ── 打卡评价 ───────────────────────── */
    .rating-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding: 9px 10px;
      background: var(--cream);
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
    }

    .rating-title {
      font-size: .66rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .rating-options {
      display: flex;
      gap: 6px;
    }

    .rate-btn {
      appearance: none;
      background: var(--yellow);
      color: var(--black);
      border: 2px solid var(--black);
      font-family: var(--sans);
      font-size: .64rem;
      font-weight: 900;
      padding: 4px 9px;
      cursor: pointer;
    }

    .rate-btn:active {
      translate: 1px 1px;
    }

    .rate-btn[data-r="good"] { background: var(--mint); }
    .rate-btn[data-r="bad"] { background: var(--pink); }

    .rate-btn:focus-visible {
      outline: 3px solid var(--black);
      outline-offset: 2px;
    }

    .rating-done {
      font-size: .66rem;
      font-weight: 900;
      letter-spacing: .04em;
    }

    /* ── 两个人的签 ─────────────────────── */
    .duo-stage {
      width: 100%;
      margin-top: 34px;
      scroll-margin-top: 16px;
    }

    .duo-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .duo-title {
      font-family: var(--display);
      font-size: .86rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .duo-hint {
      font-size: .6rem;
      font-weight: 700;
      color: rgba(17, 17, 17, .55);
    }

    .duo-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .duo-card {
      appearance: none;
      background: var(--cream);
      color: var(--black);
      border: 4px solid var(--black);
      box-shadow: 6px 6px 0 var(--black);
      padding: 12px 11px 14px;
      text-align: left;
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: background .15s, transform .08s, box-shadow .08s;
    }

    .duo-card:active {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--black);
    }

    .duo-card.on {
      background: var(--yellow);
      box-shadow: 8px 8px 0 var(--black);
    }

    .duo-card.done {
      opacity: .75;
    }

    .duo-owner {
      font-size: .58rem;
      font-weight: 900;
      letter-spacing: .18em;
      color: var(--red);
    }

    .duo-icon {
      font-size: 2.1rem;
      line-height: 1;
    }

    .duo-name {
      font-family: var(--display);
      font-size: 1.32rem;
      font-weight: 900;
      letter-spacing: -.01em;
      line-height: 1.15;
    }

    .duo-no {
      font-size: .54rem;
      font-weight: 900;
      color: rgba(17, 17, 17, .55);
      letter-spacing: .06em;
    }

    .duo-judge {
      font-size: .66rem;
      line-height: 1.6;
      color: rgba(17, 17, 17, .7);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .duo-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    /* ── 页脚 ───────────────────────────── */
    .dock {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 38px;
      padding-top: 14px;
      border-top: 3px dashed rgba(17, 17, 17, .35);
    }

    .dock button {
      appearance: none;
      background: none;
      border: 0;
      color: var(--black);
      font-family: var(--sans);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .06em;
      padding: 5px 2px;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .dock .count {
      display: inline-block;
      min-width: 18px;
      background: var(--black);
      color: var(--cream);
      font-family: var(--display);
      font-size: .62rem;
      text-align: center;
      padding: 1px 4px;
      margin-left: 3px;
      text-decoration: none;
    }

    /* ── 抽屉 ───────────────────────────── */
    .drawer {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(17, 17, 17, 0);
      visibility: hidden;
      transition: background .25s, visibility .25s;
    }

    .drawer.open {
      background: rgba(17, 17, 17, .55);
      visibility: visible;
    }

    .drawer-panel {
      width: min(100%, 480px);
      max-height: 72vh;
      overflow-y: auto;
      background: var(--cream);
      border: 5px solid var(--black);
      border-bottom: 0;
      box-shadow: 0 -10px 0 rgba(17, 17, 17, .2);
      padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
      transform: translateY(102%);
      transition: transform .3s var(--press);
    }

    .drawer.open .drawer-panel {
      transform: translateY(0);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 3px dashed var(--black);
      margin-bottom: 4px;
    }

    .drawer-head h2 {
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: .1em;
    }

    .drawer-close {
      appearance: none;
      background: var(--cream);
      border: 3px solid var(--black);
      box-shadow: 3px 3px 0 var(--black);
      font: inherit;
      font-size: .9rem;
      font-weight: 900;
      line-height: 1;
      padding: 3px 8px;
      cursor: pointer;
    }

    .log-list {
      list-style: none;
    }

    .log-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 2px solid rgba(17, 17, 17, .14);
      font-size: .8rem;
    }

    .log-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    .log-name {
      font-family: var(--display);
      font-size: .9rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .log-tag {
      font-size: .58rem;
      font-weight: 900;
      letter-spacing: .06em;
      border: 2px solid var(--black);
      padding: 1px 5px;
      white-space: nowrap;
    }

    .log-tag.accepted {
      background: var(--mint);
    }

    .log-rate {
      appearance: none;
      background: var(--yellow);
      color: var(--black);
      border: 2px solid var(--black);
      font-family: var(--sans);
      font-size: .56rem;
      font-weight: 900;
      padding: 1px 5px;
      cursor: pointer;
    }

    .inline-rate {
      margin-left: auto;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .inline-rate button {
      appearance: none;
      background: var(--cream);
      color: var(--black);
      border: 2px solid var(--black);
      font-family: var(--sans);
      font-size: .56rem;
      font-weight: 900;
      padding: 1px 5px;
      cursor: pointer;
    }

    .inline-rate button[data-r="good"] { background: var(--mint); }
    .inline-rate button[data-r="bad"] { background: var(--pink); }

    .log-time {
      margin-left: auto;
      font-size: .58rem;
      font-weight: 700;
      color: rgba(17, 17, 17, .55);
      white-space: nowrap;
    }

    .log-empty {
      padding: 24px 0;
      text-align: center;
      font-size: .78rem;
      font-weight: 700;
      color: rgba(17, 17, 17, .55);
    }

    /* ── 口味档案 ───────────────────────── */
    .profile-body {
      padding: 12px 0 4px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .profile-stat {
      border: 3px solid var(--black);
      padding: 8px 10px;
      background: var(--cream);
    }

    .profile-stat b {
      display: block;
      font-family: var(--display);
      font-size: 1.55rem;
      font-weight: 900;
      line-height: 1.15;
    }

    .profile-stat span {
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: .1em;
      color: rgba(17, 17, 17, .6);
    }

    .profile-line {
      margin-top: 10px;
      padding: 7px 9px;
      border: 3px solid var(--black);
      background: var(--yellow);
      font-size: .72rem;
      font-weight: 700;
      line-height: 1.65;
    }

    .profile-empty {
      padding: 22px 4px;
      text-align: center;
      font-size: .78rem;
      font-weight: 700;
      line-height: 1.9;
      color: rgba(17, 17, 17, .6);
    }

    .profile-weekly {
      width: 100%;
      margin-top: 14px;
      padding: 12px 0;
    }

    .profile-weekly:disabled {
      opacity: .55;
      cursor: default;
    }

    /* ── 心情前缀 / 名号 / 小本本 ───────── */
    .mood-prefix {
      margin: 6px 0 9px;
      padding: 7px 10px;
      border-left: 5px solid var(--red);
      background: rgba(255, 77, 46, .1);
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.72;
      color: var(--black);
    }

    .ticket-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 3px dashed rgba(17, 17, 17, .3);
    }

    .tt-btn {
      appearance: none;
      background: none;
      border: 0;
      color: var(--black);
      font-family: var(--sans);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .03em;
      padding: 3px 0;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      text-align: left;
    }

    .tt-btn:hover {
      color: var(--red);
    }

    .sin-count {
      display: inline-block;
      min-width: 17px;
      background: var(--black);
      color: var(--cream);
      font-family: var(--display);
      font-size: .56rem;
      text-align: center;
      padding: 1px 4px;
      margin-left: 2px;
      text-decoration: none;
    }

    .name-note,
    .sin-note {
      margin: 10px 0 12px;
      font-size: .74rem;
      font-weight: 700;
      line-height: 1.8;
      color: rgba(17, 17, 17, .65);
    }

    .name-input {
      width: 100%;
      appearance: none;
      background: var(--cream);
      color: var(--black);
      border: 3px solid var(--black);
      box-shadow: inset 3px 3px 0 rgba(17, 17, 17, .08);
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 700;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .name-input:focus {
      outline: 3px solid var(--red);
      outline-offset: 2px;
    }

    .name-send {
      width: 100%;
      padding: 12px 0;
    }

    .sin-list {
      list-style: none;
    }

    .sin-item {
      border-bottom: 2px solid rgba(17, 17, 17, .12);
    }

    .sin-row {
      width: 100%;
      appearance: none;
      background: none;
      border: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 0;
      font-family: var(--sans);
      font-size: .78rem;
      font-weight: 700;
      color: var(--black);
      cursor: pointer;
      text-align: left;
    }

    .sin-row .sin-time {
      margin-left: auto;
      font-size: .58rem;
      font-weight: 700;
      color: rgba(17, 17, 17, .55);
      white-space: nowrap;
    }

    .sin-verdict {
      margin: 0 0 10px;
      padding: 8px 10px;
      border-left: 4px solid var(--red);
      background: rgba(255, 77, 46, .1);
      font-size: .74rem;
      font-weight: 700;
      line-height: 1.7;
    }

    .sin-empty {
      padding: 24px 0;
      text-align: center;
      font-size: .76rem;
      font-weight: 700;
      color: rgba(17, 17, 17, .55);
    }

    /* ── Toast ──────────────────────────── */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      z-index: 60;
      transform: translate(-50%, 16px);
      max-width: min(88vw, 400px);
      padding: 10px 16px;
      background: var(--black);
      color: var(--cream);
      border: 3px solid var(--cream);
      box-shadow: 5px 5px 0 rgba(17, 17, 17, .4);
      font-size: .76rem;
      font-weight: 700;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s, transform .22s var(--press);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ── 动画与响应式 ───────────────────── */
    @keyframes tube-breathe {
      0%, 100% { transform: translateX(-50%) rotate(-2deg); }
      50% { transform: translateX(-50%) rotate(-1deg) translateY(-2px); }
    }

    .tube.shaking .tube-body,
    .tube.shaking .tube-mouth,
    .tube.shaking .tube-band,
    .tube.shaking .sticks {
      animation: tube-shake .6s ease-in-out;
    }

    .tube.shaking .stick:nth-child(3n) {
      animation: stick-hop .6s ease-in-out;
    }

    @keyframes tube-shake {
      0%, 100% { translate: 0 0; rotate: 0deg; }
      18% { translate: -6px 0; rotate: -2.4deg; }
      42% { translate: 6px 0; rotate: 2deg; }
      66% { translate: -3px 0; rotate: -1deg; }
    }

    @keyframes stick-hop {
      0%, 100% { translate: 0 0; }
      38% { translate: 0 -9px; }
    }

    @media (min-width: 560px) {
      .tube-wrap {
        transform: scale(1.14);
        margin: 24px 0 18px;
      }
    }

    @media (max-width: 380px) {
      .counter {
        padding-left: 12px;
        padding-right: 12px;
      }

      .tube {
        width: 154px;
        height: 200px;
      }

      .sticks {
        bottom: 170px;
        width: 128px;
      }

      .tube-body {
        width: 116px;
        height: 170px;
      }

      .tube-mouth {
        bottom: 154px;
        width: 116px;
      }

      .tube-tip {
        right: -24px;
      }

      .tube-wrap {
        padding-top: 78px;
      }

      .ticket {
        padding: 15px 14px 20px;
      }

      .stamp {
        right: 12px;
        bottom: 12px;
        width: 44px;
        height: 54px;
        font-size: 1rem;
      }

      .foot-meta {
        margin-right: 50px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    ::selection {
      background: var(--red);
      color: var(--cream);
    }
  </style>
</head>

<body>
  <div class="wall" aria-hidden="true"></div>

  <main class="counter">
    <div class="topbar">
      <span class="brand-mark" aria-hidden="true">食 神</span>
      <div class="top-right">
        <span class="period" id="periodLabel">午时</span>
        <button class="sound-btn" id="soundBtn" type="button" data-on="true" aria-pressed="true">声音 开</button>
      </div>
    </div>

    <header class="masthead">
      <h1>食神签</h1>
      <p class="sub">后厨出的单子，比你自己拿主意准</p>
    </header>

    <div class="mode-switch" role="group" aria-label="几个人吃">
      <button class="mode-btn on" type="button" data-mode="solo">一个人</button>
      <button class="mode-btn" type="button" data-mode="duo">两个人</button>
    </div>

    <section class="oracle" aria-label="求签">
      <div class="tube-wrap">
        <button class="tube hint-pulse" id="tube" type="button" aria-label="摇一签">
          <span class="sticks" id="sticks" aria-hidden="true"></span>
          <span class="tube-body"><span class="tube-band">食 神</span></span>
          <span class="tube-mouth" aria-hidden="true"></span>
          <span class="tube-tip" aria-hidden="true">↙ 摇这里</span>
        </button>
      </div>

      <p class="hint" id="hint">摇一摇，或者点一下</p>

      <div class="filters">
        <div class="filters-head">
          <span class="filters-title">今天想吃</span>
          <span class="filters-count" id="filterCount">全部 100 道</span>
        </div>
        <div class="chips" id="chips" role="group" aria-label="按分类筛选"></div>
        <div class="chips diet-chips" id="dietChips" role="group" aria-label="忌口与预算"></div>
      </div>

      <button class="draw-btn" id="drawBtn" type="button">摇 一 签</button>
    </section>

    <section class="empty-note" id="emptyNote">
      <span class="big">签筒里备着一百道菜</span>
      摇一摇，今天就不用再想了。
    </section>

    <section class="ticket-stage" id="ticketStage" hidden>
      <article class="ticket" id="ticket" aria-live="polite">
        <div class="ticket-top">
          <span class="ticket-no" id="ticketNo">第 001 签</span>
          <span class="ticket-cert" aria-hidden="true">食 神 认 证</span>
        </div>

        <div class="dish">
          <span class="dish-icon" id="dishIcon" aria-hidden="true">🍜</span>
          <div class="dish-text">
            <h2 class="dish-name" id="dishName">—</h2>
            <p class="dish-meta">
              <span class="cat" id="dishCat">—</span>
              <span id="dishPeriod">—</span>
            </p>
          </div>
        </div>

        <p class="mood-line" id="moodLine" hidden></p>

        <div class="block">
          <span class="label" id="timeTitle">午时判词</span>
          <p id="timeJudge"></p>
        </div>

        <div class="block">
          <span class="label">食神断语</span>
          <p class="mood-prefix" id="moodPrefix" hidden></p>
          <p id="verdict"></p>
        </div>

        <div class="dos">
          <div class="do">
            <b>宜</b>
            <span id="dosList"></span>
          </div>
          <div class="do dont">
            <b>忌</b>
            <span id="dontsList"></span>
          </div>
        </div>

        <div class="ticket-foot">
          <span class="barcode" aria-hidden="true"></span>
          <span class="foot-meta">
            <span id="ticketDate">—</span><br>
            <span>yileina.cyou</span>
          </span>
        </div>

        <div class="stamp" id="stamp" aria-hidden="true">天意</div>
      </article>

      <div class="actions">
        <button class="btn primary" id="acceptBtn" type="button">就吃这个</button>
        <button class="btn ghost" id="againBtn" type="button">换一签</button>
      </div>

      <div class="ticket-tools">
        <button class="tt-btn" id="nameBtn" type="button">神还没记住你的名号</button>
        <button class="tt-btn" id="sinBtn" type="button">小本本 <span class="sin-count" id="sinCount">0</span></button>
      </div>

      <div class="rating-bar" id="ratingBar" hidden>
        <span class="rating-title">吃完了？</span>
        <div class="rating-options" id="ratingOptions">
          <button class="rate-btn" type="button" data-r="good">好吃</button>
          <button class="rate-btn" type="button" data-r="meh">一般</button>
          <button class="rate-btn" type="button" data-r="bad">踩雷</button>
        </div>
        <span class="rating-done" id="ratingDone" hidden></span>
      </div>
    </section>

    <section class="duo-stage" id="duoStage" hidden>
      <div class="duo-head">
        <span class="duo-title">两个人的签</span>
        <span class="duo-hint">点一张选它</span>
      </div>
      <div class="duo-cards" id="duoCards"></div>
      <div class="duo-actions">
        <button class="btn primary" id="duoAccept" type="button">就这个</button>
        <button class="btn ghost" id="duoAgain" type="button">再来一轮</button>
      </div>
    </section>

    <footer class="dock">
      <button id="historyBtn" type="button">求签簿 <span class="count" id="historyCount">0</span></button>
      <button id="profileBtn" type="button">我的口味</button>
      <button id="saveBtn" type="button">存为图片</button>
    </footer>
  </main>

  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="求签簿">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2>求签簿</h2>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭">✕</button>
      </div>
      <ul class="log-list" id="logList"></ul>
    </div>
  </div>

  <div class="drawer" id="profileDrawer" role="dialog" aria-modal="true" aria-label="我的口味">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2>我的口味</h2>
        <button class="drawer-close" id="profileClose" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="profile-body" id="profileBody"></div>
      <button class="btn primary profile-weekly" id="weeklyBtn" type="button">生成本周小结图</button>
    </div>
  </div>

  <div class="drawer" id="nameDrawer" role="dialog" aria-modal="true" aria-label="食神的信">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2>食神的信</h2>
        <button class="drawer-close" id="nameClose" type="button" aria-label="关闭">✕</button>
      </div>
      <p class="name-note" id="nameNote">留个名号，神会记住你。不必是真名。</p>
      <input class="name-input" id="nameInput" maxlength="12" placeholder="写下你的名号…">
      <button class="btn primary name-send" id="nameSend" type="button">投 递</button>
    </div>
  </div>

  <div class="drawer" id="sinDrawer" role="dialog" aria-modal="true" aria-label="记仇小本本">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2>记仇小本本</h2>
        <button class="drawer-close" id="sinClose" type="button" aria-label="关闭">✕</button>
      </div>
      <p class="sin-note">每换一签，神都记一笔。点一条，看看神当时想说什么。</p>
      <ul class="sin-list" id="sinList"></ul>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>

    const FOOD_DATABASE = [

      // ── 早餐经典 (18) ──────────────────────
      {
        id: 'doujiang_youtiao', name: '豆浆油条', icon: '🥖', category: '早餐经典',
        time_judgement: {
          morning: '晨光熹微，油条蘸豆浆，这是属于早鸟的正统朝食。食神点头：你今日的作息，勉强及格。',
          noon: '正午求此物？你的胃里住着一个不肯搬走的清晨。也罢，这顿神赐名【迟到的晨曦忏悔餐】。',

      },
      {
        id: 'jianbingguozi', name: '煎饼果子', icon: '🫓', category: '早餐经典',
        time_judgement: {
          morning: '晨起煎饼果子，你是懂生活的人。加薄脆还是油条？这是你今天最重要的决定。食神点头：街头正统，气度不凡。',
          noon: '中午吃煎饼？你是睡过头了还是单纯想念这个味道？煎饼果子不受时辰约束，它有自己的时区叫「任何时候都好吃」。',
          evening: '晚来煎饼，你的饮食习惯已被标记为「随性派」。食神理解——一个好吃的煎饼果子确实不需要看时间。',

    const wait = ms => new Promise(r => setTimeout(r, ms));

    function hash(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return h;
    }

    function dateKey(d = new Date()) {
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${d.getFullYear()}-${m}-${day}`;
    }

    function stampText(d = new Date()) {
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function periodNow(h = new Date().getHours()) {
      if (h >= 5 && h < 10) return 'morning';
      if (h >= 10 && h < 14) return 'noon';
      if (h >= 14 && h < 20) return 'evening';
      return 'night';
    }

    function byId(id) {
      return FOOD_DATABASE.find(f => f.id === id) || null;
    }

    function randomFood(excludeId) {
      const pool = excludeId ? FOOD_DATABASE.filter(f => f.id !== excludeId) : FOOD_DATABASE;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function moodOfDay() {
      const seed = hash(dateKey()) % 100;
      let acc = 0;
      for (const m of MOODS) {
        acc += m.weight;
        if (seed < acc) return m;
      }
      return MOODS[0];
    }

    function pickTwo(list, seed, offset) {
      const a = list[(seed + offset) % list.length];
      let b = list[(seed + offset + 1 + (seed % 2)) % list.length];
      if (b === a) b = list[(list.indexOf(a) + 2) % list.length];
      return [a, b];
    }

    function dosDonts(food) {
      const group = DOS_DONTS[food.category] || DOS_DONTS['米饭正餐'];
      const seed = hash(food.id);
      return {
        good: pickTwo(group.good, seed, 0),
        bad: pickTwo(group.bad, seed, 1)
      };
    }

    function ticketNumber(food) {
      return String(hash(food.id) % 100 + 1).padStart(3, '0');
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (saved.daily) state.daily = saved.daily;
        if (Array.isArray(saved.history)) state.history = saved.history.slice(0, 100);
        if (typeof saved.rejects === 'number') state.rejects = saved.rejects;
        if (typeof saved.sound === 'boolean') state.sound = saved.sound;
      } catch (e) { /* 存储损坏时从空白开始 */ }

      const today = dateKey();
      if (state.daily && state.daily.date !== today) {
        state.daily = null;
        state.rejects = 0;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          daily: state.daily,
          history: state.history,
          rejects: state.rejects,
          sound: state.sound
        }));
      } catch (e) { /* 无痕模式下忽略 */ }
    }

    function play(name) {
      if (!state.sound) return;
      const a = sfx[name];
      if (!a) return;
      try {
        a.currentTime = 0;
        a.play().catch(() => { });
      } catch (e) { }
    }

    function unlockAudio() {
      if (!state.sound) return;
      Object.values(sfx).forEach(a => {
        const v = a.volume;
        a.volume = 0;
        a.play().then(() => {
          a.pause();
          a.currentTime = 0;
          a.volume = v;
        }).catch(() => { });
      });
    }

        s.className = 'stick';
        const x = (Math.random() - 0.5) * 92;
        s.style.setProperty('--x', x.toFixed(1) + 'px');
        s.style.setProperty('--r', ((Math.random() - 0.5) * 16).toFixed(1) + 'deg');
        s.style.setProperty('--h', (66 + Math.random() * 18).toFixed(0) + 'px');
        s.style.zIndex = String(10 + Math.round(x));
        el.sticks.appendChild(s);
      }
    }

    function renderTicket(food) {
      const period = periodNow();
      el.no.textContent = '第 ' + ticketNumber(food) + ' 签';
      el.icon.textContent = food.icon;
      el.name.textContent = food.name;
      el.cat.textContent = food.category;
      el.period.textContent = PERIOD_LABEL[period];
      el.timeTitle.textContent = PERIOD_LABEL[period] + '判词';
      el.timeJudge.textContent = food.time_judgement[period];
      el.verdict.textContent = food.diagnosis;

      const mood = effectiveMood(food);
      el.moodLine.hidden = !mood.line;
      el.moodLine.textContent = mood.line;
      if (el.moodPrefix) {
        el.moodPrefix.hidden = !mood.prefix;
        el.moodPrefix.textContent = mood.prefix;
      }

      const picks = dosDonts(food);
      el.dos.textContent = picks.good.join('、');
      el.donts.textContent = picks.bad.join('、');
      el.date.textContent = stampText();

      const stampLabel = mood.stamp || '天意';
      el.stamp.textContent = stampLabel;
      el.stamp.style.fontSize = stampLabel.length > 2 ? '0.84rem' : '';
      el.stamp.classList.remove('down', 'accepted');

      el.accept.disabled = false;
      el.accept.textContent = '就吃这个';
    }

    function renderHistoryCount() {
      el.historyCount.textContent = String(state.history.length);
    }

    function renderLog() {
      if (!state.history.length) {
        el.logList.innerHTML = '<li class="log-empty">还没有求过签。</li>';
        return;
      }
      el.logList.innerHTML = state.history.map(item => {
        const t = new Date(item.ts);
        const p = n => String(n).padStart(2, '0');
        const time = `${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
        return `<li class="log-item">
          <span class="log-icon">${item.icon}</span>
          <span class="log-name">${item.name}</span>
          <span class="log-tag ${item.accepted ? 'accepted' : ''}">${item.accepted ? '吃了' : '没吃'}</span>
          <span class="log-time">${time}</span>
        </li>`;
      }).join('');
    }

    function showToast(msg, ms = 2400) {
      el.toast.textContent = msg;
      el.toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.toast.classList.remove('show'), ms);
    }

    // ═══════════════════════════════════════════
    //  抽签
    // ═══════════════════════════════════════════
    function recordHistory(food) {
      state.history.unshift({
        id: food.id, name: food.name, icon: food.icon,
        ts: Date.now(), accepted: false
      });
      state.history = state.history.slice(0, 100);
      renderHistoryCount();
      saveState();
    }

    async function draw(options = {}) {
      const { reroll = false, review = false } = options;
      if (state.busy) return;
      if (el.tube.classList.contains('locked')) return;

      const today = dateKey();
      let food;
      let isReview = false;

      if (!reroll && !review && state.daily && state.daily.date === today) {
        // 今天已经抽过：直接给当天那一签，不重复记录
        food = byId(state.daily.id) || randomFood();
        isReview = true;
      } else if (review && state.daily && state.daily.date === today) {
        food = byId(state.daily.id) || randomFood();
        isReview = true;
      } else if (reroll) {
        food = randomFood(state.current ? state.current.id : null);
      } else {
        food = randomFood();
        state.daily = { date: today, id: food.id, accepted: false };
      }

      state.busy = true;
      state.reviewing = isReview;
      el.drawBtn.disabled = true;
      el.hint.style.opacity = '.35';
      el.empty.hidden = true;

      if (!isReview) {
        state.current = { ...food, accepted: false };
        recordHistory(food);
      } else {
        state.current = { ...food, accepted: !!(state.daily && state.daily.accepted) };
      }

      play('shake');
      el.tube.classList.add('shaking');
      await wait(560);
      el.tube.classList.remove('shaking');

      // 飞一支签
      const sticks = el.sticks.querySelectorAll('.stick');
      const flyer = sticks[Math.floor(sticks.length / 2)];
      if (flyer) {
        flyer.classList.add('fly');
        setTimeout(() => flyer.classList.remove('fly'), 700);
      }
      play('drop');
      await wait(180);

      el.stage.hidden = false;
      renderTicket(food);

      el.ticket.classList.remove('play');
      void el.ticket.offsetWidth;
      el.ticket.classList.add('play');
      play('reveal');

      if (state.current.accepted) {
        el.stamp.textContent = '已领';
        el.stamp.style.fontSize = '';
        el.stamp.classList.add('accepted');
        el.accept.disabled = true;
        el.accept.textContent = '已经记下了';
      }

      await wait(520);
      el.stamp.classList.add('down');

      el.hint.style.opacity = '';
      el.hint.textContent = isReview ? '这是今天的那一签' : '签已出，趁热看';
      el.drawBtn.disabled = false;
      el.drawBtn.hidden = true;
      state.busy = false;
      state.reviewing = false;

      // 签纸很长，抽出后直接把视口带到签纸顶部；瞬时滚动比平滑更不容易被忽略
      requestAnimationFrame(() => el.stage.scrollIntoView({ block: 'start' }));
    }

    // ═══════════════════════════════════════════
    //  交互
    // ═══════════════════════════════════════════
    async function requestMotionPermission() {
      if (typeof DeviceOrientationEvent === 'undefined' ||
        typeof DeviceOrientationEvent.requestPermission !== 'function') return;
      try {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p === 'granted') attachShake();
      } catch (e) { }
    }

    let shakeBound = false;
    function attachShake() {
      if (shakeBound || !window.DeviceMotionEvent) return;
      shakeBound = true;
      let last = 0, lx = 0, ly = 0, lz = 0;
      window.addEventListener('devicemotion', e => {
        const a = e.accelerationIncludingGravity;
        if (!a) return;
        const d = Math.abs(a.x - lx) + Math.abs(a.y - ly) + Math.abs(a.z - lz);
        if (d > 28 && Date.now() - last > 2600 && !state.busy) {
          last = Date.now();
          draw();
        }
        lx = a.x; ly = a.y; lz = a.z;
      });
    }

    function startDraw() {
      if (!el.stage.hidden) return;
      unlockAudio();
      requestMotionPermission().then(() => {
        const hasDaily = state.daily && state.daily.date === dateKey();
        draw(hasDaily ? { review: true } : {});
      });
    }

    function bind() {
      el.tube.addEventListener('click', startDraw);
      el.drawBtn.addEventListener('click', startDraw);

      el.again.addEventListener('click', () => {
        if (state.busy) return;
        state.rejects++;
        saveState();
        if (state.rejects >= 2) {
          const idx = Math.min(state.rejects - 2, TAUNTS.length - 1);
          showToast(TAUNTS[idx]);
        }
        play('reject');
        draw({ reroll: true });
      });

      el.accept.addEventListener('click', () => {
        if (!state.current || state.current.accepted) return;
        state.current.accepted = true;
        // 最终吃的那一份就是今天的签，换过签也以采纳的为准
        state.daily = { date: dateKey(), id: state.current.id, accepted: true };
        const item = state.history.find(h => h.id === state.current.id && !h.accepted);
        if (item) item.accepted = true;
        el.stamp.textContent = '已领';
        el.stamp.style.fontSize = '';
        el.stamp.classList.add('accepted');
        el.accept.disabled = true;
        el.accept.textContent = '已经记下了';
        saveState();
        renderLog();
        showToast(state.current.name + '。行，就它了。', 3000);
      });

      el.soundBtn.addEventListener('click', () => {
        state.sound = !state.sound;
        el.soundBtn.dataset.on = String(state.sound);
        el.soundBtn.textContent = state.sound ? '声音 开' : '声音 关';
        el.soundBtn.setAttribute('aria-pressed', String(state.sound));
        if (state.sound) { unlockAudio(); play('drop'); }
        saveState();
      });

      el.historyBtn.addEventListener('click', () => {
        renderLog();
        el.drawer.classList.add('open');
      });

      el.drawerClose.addEventListener('click', () => el.drawer.classList.remove('open'));
      el.drawer.addEventListener('click', e => {
        if (e.target === el.drawer) el.drawer.classList.remove('open');
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') el.drawer.classList.remove('open');
        if (e.code === 'Space' && !el.drawer.classList.contains('open') &&
          document.activeElement === document.body) {
          e.preventDefault();
          el.drawBtn.click();
        }
      });

      el.saveBtn.addEventListener('click', () => {
        if (!state.current) { showToast('先摇一签，才有东西可存。'); return; }
        saveAsImage(state.current);
      });

      attachShake();
    }

    // ═══════════════════════════════════════════
    //  分享图（canvas 手绘）
    // ═══════════════════════════════════════════
    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = String(text).split('');
      let line = '';
      let curY = y;
      for (let i = 0; i < chars.length; i++) {
        const test = line + chars[i];
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, curY);
          line = chars[i];
          curY += lineHeight;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, curY);
      return curY;
    }

    function saveAsImage(food) {
      const W = 1080;
      const period = periodNow();
      const picks = dosDonts(food);
      const bodyFont = '500 32px "PingFang SC","Microsoft YaHei",sans-serif';
      const lineH = 54;
      const pad = 56;
      const paperX = pad;
      const paperY = 92;
      const paperW = W - pad * 2;
      const innerX = paperX + 44;
      const textW = paperW - 88;
      const labelH = 34;
      const gapLabel = 30;

      const measure = document.createElement('canvas').getContext('2d');
      const countLines = (text, font, maxWidth) => {
        measure.font = font;
        let lines = 1;
        let line = '';
        for (const ch of String(text)) {
          if (measure.measureText(line + ch).width > maxWidth && line) {
            lines++;
            line = ch;
          } else {
            line += ch;
          }
        }
        return lines;
      };

      const timeLines = countLines(food.time_judgement[period], bodyFont, textW);
      const verdictLines = countLines(food.diagnosis, bodyFont, textW);

      // 一次性把整张签纸的纵向坐标算出来，绘制时不再累加
      const L = {};
      L.no = 40;
      L.dish = 168;
      L.cat = 210;
      L.timeLabel = 264;
      L.timeText = L.timeLabel + labelH + gapLabel;
      L.verdictLabel = L.timeText + (timeLines - 1) * lineH + 44;
      L.verdictText = L.verdictLabel + labelH + gapLabel;
      L.dos = L.verdictText + (verdictLines - 1) * lineH + 40;
      L.foot = L.dos + 108 + 34;
      L.paperH = L.foot + 76 + 44;

      const H = paperY + L.paperH + 96;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // 黄底 + 点阵
      ctx.fillStyle = '#ffd84d';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(17,17,17,.16)';
      for (let py = 12; py < H; py += 24) {
        for (let px = 12; px < W; px += 24) {
          ctx.beginPath();
          ctx.arc(px, py, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 硬阴影 + 签纸
      ctx.fillStyle = '#111111';
      ctx.fillRect(paperX + 16, paperY + 16, paperW, L.paperH);
      ctx.fillStyle = '#fffdf5';
      ctx.fillRect(paperX, paperY, paperW, L.paperH);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 10;
      ctx.strokeRect(paperX, paperY, paperW, L.paperH);

      // 签号
      ctx.fillStyle = '#111111';
      ctx.fillRect(innerX, paperY + L.no, 214, 46);
      ctx.fillStyle = '#fffdf5';
      ctx.font = '900 26px "Arial Black","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('第 ' + ticketNumber(food) + ' 签', innerX + 16, paperY + L.no + 32);

      // 认证
      ctx.strokeStyle = '#ff4d2e';
      ctx.lineWidth = 3;
      ctx.strokeRect(W - pad - 190, paperY + L.no + 4, 190, 38);
      ctx.fillStyle = '#ff4d2e';
      ctx.font = '900 18px "Arial Black","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('食神认证', W - pad - 95, paperY + L.no + 30);

      // 食物
      ctx.textAlign = 'left';
      ctx.font = '900 82px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
      ctx.fillText(food.icon, innerX, paperY + L.dish + 4);
      ctx.fillStyle = '#111111';
      ctx.font = '900 76px "Arial Black","Microsoft YaHei",sans-serif';
      ctx.fillText(food.name, innerX + 138, paperY + L.dish);
      ctx.fillStyle = '#ff4d2e';
      const nameW = Math.min(textW - 138, Math.max(150, 74 * food.name.length));
      ctx.fillRect(innerX + 138, paperY + L.dish + 18, nameW, 9);

      // 分类
      ctx.fillStyle = '#ffd84d';
      ctx.fillRect(innerX, paperY + L.cat, 340, 42);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 3;
      ctx.strokeRect(innerX, paperY + L.cat, 340, 42);
      ctx.fillStyle = '#111111';
      ctx.font = '900 20px "Arial Black","Microsoft YaHei",sans-serif';
      ctx.fillText(food.category + ' · ' + PERIOD_LABEL[period], innerX + 14, paperY + L.cat + 29);

      // 判词
      ctx.fillStyle = '#111111';
      ctx.fillRect(innerX, paperY + L.timeLabel, 154, labelH);
      ctx.fillStyle = '#fffdf5';
      ctx.font = '900 20px "Microsoft YaHei",sans-serif';
      ctx.fillText(PERIOD_LABEL[period] + '判词', innerX + 14, paperY + L.timeLabel + 25);
      ctx.fillStyle = '#111111';
      ctx.font = bodyFont;
      wrapText(ctx, food.time_judgement[period], innerX, paperY + L.timeText, textW, lineH);

      // 断语
      ctx.fillStyle = '#111111';
      ctx.fillRect(innerX, paperY + L.verdictLabel, 154, labelH);
      ctx.fillStyle = '#fffdf5';
      ctx.font = '900 20px "Microsoft YaHei",sans-serif';
      ctx.fillText('食神断语', innerX + 14, paperY + L.verdictLabel + 25);
      ctx.fillStyle = '#111111';
      ctx.font = bodyFont;
      wrapText(ctx, food.diagnosis, innerX, paperY + L.verdictText, textW, lineH);

      // 宜忌
      const boxW = (textW - 22) / 2;
      const boxH = 108;
      const boxY = paperY + L.dos;
      ctx.fillStyle = '#23c9a0';
      ctx.fillRect(innerX, boxY, boxW, boxH);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 3;
      ctx.strokeRect(innerX, boxY, boxW, boxH);
      ctx.fillStyle = '#111111';
      ctx.font = '900 20px "Microsoft YaHei",sans-serif';
      ctx.fillText('宜', innerX + 16, boxY + 32);
      ctx.font = '700 22px "Microsoft YaHei",sans-serif';
      ctx.fillText(picks.good.join('、'), innerX + 16, boxY + 72);

      const x2 = innerX + boxW + 22;
      ctx.fillStyle = '#ff8f7a';
      ctx.fillRect(x2, boxY, boxW, boxH);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 3;
      ctx.strokeRect(x2, boxY, boxW, boxH);
      ctx.fillStyle = '#111111';
      ctx.font = '900 20px "Microsoft YaHei",sans-serif';
      ctx.fillText('忌', x2 + 16, boxY + 32);
      ctx.font = '700 22px "Microsoft YaHei",sans-serif';
      ctx.fillText(picks.bad.join('、'), x2 + 16, boxY + 72);

      // 底部虚线
      const footY = paperY + L.foot;
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(innerX, footY);
      ctx.lineTo(innerX + textW, footY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 条码
      ctx.fillStyle = '#111111';
      for (let i = 0; i < 34; i++) {
        const bw = 3 + (i % 3);
        ctx.fillRect(innerX + i * 9, footY + 22, bw, 52);
      }

      // 日期域名：右对齐到印章左侧
      ctx.fillStyle = '#111111';
      ctx.font = '900 17px "Courier New",monospace';
      ctx.textAlign = 'right';
      ctx.fillText(stampText(), innerX + textW - 148, footY + 46);
      ctx.fillText('yileina.cyou/tools/food-oracle', innerX + textW - 148, footY + 74);

      // 印章：右下角，压在虚线上
      ctx.save();
      ctx.translate(innerX + textW - 66, footY + 26);
      ctx.rotate(-9 * Math.PI / 180);
      ctx.strokeStyle = '#ff4d2e';
      ctx.lineWidth = 6;
      ctx.strokeRect(-46, -50, 92, 100);
      ctx.fillStyle = '#ff4d2e';
      ctx.textAlign = 'center';
      ctx.font = '900 42px "Arial Black","Microsoft YaHei",sans-serif';
      ctx.fillText('天', 0, -4);
      ctx.fillText('意', 0, 46);
      ctx.restore();

      canvas.toBlob(blob => {
        if (!blob) { showToast('生成图片失败，试试直接截图。'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '食神签-' + food.name + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('图存好了。发给人，让他也别想了。', 3000);
      }, 'image/png');
    }
    //  启动
    // ═══════════════════════════════════════════
    function init() {
      loadState();
      buildSticks();
      renderHistoryCount();
      renderLog();

      el.periodLabel.textContent = PERIOD_LABEL[periodNow()];
      el.soundBtn.dataset.on = String(state.sound);
      el.soundBtn.textContent = state.sound ? '声音 开' : '声音 关';
      el.soundBtn.setAttribute('aria-pressed', String(state.sound));

      if (state.daily && state.daily.date === dateKey()) {
        const food = byId(state.daily.id);
        el.drawBtn.textContent = state.daily.accepted ? '看 今 天 的 签' : '看 今 日 签';
        if (food) el.hint.textContent = '今天神已经给过你答案了';
        el.empty.innerHTML = '<span class="big">今天的签已经出了</span>点上面，看看神怎么说。';
      }

      bind();

      // 深夜的墙更暗一点
      if (periodNow() === 'night') {
        document.documentElement.style.setProperty('--wall', '#18221d');
        document.documentElement.style.setProperty('--wall-deep', '#101813');
      }
    }
