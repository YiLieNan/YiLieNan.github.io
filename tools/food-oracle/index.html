<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食神签 · 百味审判</title>
  <style>
    :root {
      --bg-deep: #0d0d14;
      --bg-temple: #14141f;
      --gold: #c9a96e;
      --gold-light: #dfc28a;
      --gold-dim: #8a7040;
      --text-primary: #e8e0d0;
      --text-secondary: #a09888;
      --red-seal: #8b1a1a;
      --red-bright: #c42b2b;
      --ghost-green: #3a5a3a;
      --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.5);
      --shadow-gold: 0 0 40px rgba(201, 169, 110, 0.15);
      --transition-slow: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      --transition-medium: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      overflow-x: hidden
    }

    body {
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background var(--transition-slow);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(201, 169, 110, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 30% 70%, rgba(139, 26, 26, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(201, 169, 110, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(201, 169, 110, 0.015) 2px, rgba(201, 169, 110, 0.015) 3px);
      pointer-events: none;
      z-index: 0;
    }

    body.night-mode {
      background: #0a0a12
    }

    body.night-mode::before {
      background: radial-gradient(ellipse at 50% 30%, rgba(58, 90, 58, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 30% 70%, rgba(58, 42, 74, 0.1) 0%, transparent 50%);
    }

    body.night-mode .temple-title {
      color: #8ab88a
    }

    body.night-mode .god-name {
      color: #8ab88a
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px
    }

    .header {
      text-align: center;
      margin-bottom: 4px
    }

    .temple-title {
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', 'SimSun', serif;
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: .15em;
      text-shadow: 0 0 30px rgba(201, 169, 110, .3);
      user-select: none
    }

    .god-name {
      font-size: .85rem;
      color: var(--gold-dim);
      letter-spacing: .2em;
      margin-top: 4px;
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif
    }

    .mood-indicator {
      display: inline-block;
      font-size: .75rem;
      padding: 3px 14px;
      border: 1px solid var(--gold-dim);
      border-radius: 20px;
      color: var(--gold-dim);
      margin-top: 8px;
      opacity: .7;
      letter-spacing: .1em
    }

    .tube-stage {
      position: relative;
      width: 200px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 600px
    }

    .tube {
      position: relative;
      width: 100px;
      height: 220px;
      background: linear-gradient(180deg, #1a1a2e, #1f1f35 50%, #1a1a2e);
      border: 2px solid var(--gold-dim);
      border-radius: 12px 12px 20px 20px;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, .5), 0 4px 20px rgba(0, 0, 0, .5), 0 0 0 6px rgba(10, 10, 20, .8), 0 0 0 8px rgba(138, 112, 64, .3);
      cursor: pointer;
      transition: transform .1s ease, box-shadow var(--transition-medium);
      user-select: none;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12px;
      overflow: hidden
    }

    .tube:hover {
      box-shadow: inset 0 0 30px rgba(0, 0, 0, .5), 0 4px 20px rgba(0, 0, 0, .5), 0 0 0 6px rgba(10, 10, 20, .8), 0 0 0 8px rgba(138, 112, 64, .5), 0 0 50px rgba(201, 169, 110, .15)
    }

    .tube.locked {
      opacity: .45;
      pointer-events: none;
      filter: grayscale(.3);
      transition: all .3s ease;
    }

    .anger-text {
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
      font-size: .8rem;
      color: var(--red-bright);
      opacity: 0;
      transition: opacity .4s ease;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: .08em;
    }

    .anger-text.show {
      opacity: 1;
      animation: angerFloat 2s ease-out forwards;
    }

    @keyframes angerFloat {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(6px);
      }

      20% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      80% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-12px);
      }
    }


    .tube::before {
      content: '';
      position: absolute;
      top: 18px;
      left: -4px;
      right: -4px;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(201, 169, 110, .4);
      z-index: 2
    }

    .tube::after {
      content: '';
      position: absolute;
      bottom: 30px;
      left: -4px;
      right: -4px;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(201, 169, 110, .4);
      z-index: 2
    }

    .tube-base {
      position: absolute;
      bottom: -8px;
      width: 120px;
      height: 16px;
      background: linear-gradient(180deg, #2a2a3a, #1a1a2a);
      border: 2px solid var(--gold-dim);
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .5)
    }

    .stick-heads {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 6px;
      justify-content: center;
      padding: 2px 8px;
      z-index: 1
    }

    .stick-head {
      width: 6px;
      height: 22px;
      background: linear-gradient(180deg, #e8d5b0, #c9a96e, #8a7040);
      border-radius: 3px 3px 1px 1px;
      box-shadow: 0 0 4px rgba(201, 169, 110, .3)
    }

    body.night-mode .stick-head {
      box-shadow: 0 0 8px rgba(58, 180, 120, .5);
      background: linear-gradient(180deg, #c8e8c8, #8ab88a, #4a7a4a)
    }

    .tube.shaking {
      animation: tubeShake .6s ease-in-out
    }

    @keyframes tubeShake {

      0%,
      100% {
        transform: translateX(0) rotate(0deg)
      }

      10% {
        transform: translateX(-8px) rotate(-3deg)
      }

      20% {
        transform: translateX(8px) rotate(3deg)
      }

      30% {
        transform: translateX(-12px) rotate(-5deg)
      }

      40% {
        transform: translateX(12px) rotate(5deg)
      }

      50% {
        transform: translateX(-8px) rotate(-3deg)
      }

      60% {
        transform: translateX(6px) rotate(2deg)
      }

      70% {
        transform: translateX(-4px) rotate(-1deg)
      }

      80% {
        transform: translateX(3px) rotate(1deg)
      }

      90% {
        transform: translateX(-1px) rotate(0deg)
      }
    }

    .flying-stick {
      position: absolute;
      width: 8px;
      height: 80px;
      background: linear-gradient(180deg, #f0d8a0, #c9a96e, #a08050);
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(201, 169, 110, .6);
      z-index: 10;
      pointer-events: none;
      opacity: 0
    }

    .flying-stick.active {
      animation: stickFlyOut 1.2s cubic-bezier(.25, .46, .45, .94) forwards
    }

    @keyframes stickFlyOut {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1)
      }

      30% {
        opacity: 1;
        transform: translateY(-60px) rotate(180deg) scale(1.1)
      }

      60% {
        opacity: 1;
        transform: translateY(-100px) rotate(360deg) scale(.9)
      }

      80% {
        opacity: 1;
        transform: translateY(-40px) rotate(540deg) scale(1)
      }

      100% {
        opacity: 0;
        transform: translateY(20px) rotate(720deg) scale(.3)
      }
    }

    .hint-text {
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
      font-size: .9rem;
      color: var(--text-secondary);
      letter-spacing: .1em;
      text-align: center;
      opacity: .7;
      transition: opacity var(--transition-medium)
    }

    .diagnosis-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #1f1f30, #181825);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 28px 24px;
      position: relative;
      box-shadow: var(--shadow-soft), var(--shadow-gold);
      opacity: 0;
      transform: translateY(20px);
      transition: all .5s cubic-bezier(.23, 1, .32, 1);
      pointer-events: none
    }

    .diagnosis-card.revealed {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto
    }

    .diagnosis-card::after {
      content: '食神御判';
      position: absolute;
      top: 16px;
      right: 20px;
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
      font-size: .85rem;
      color: var(--red-seal);
      border: 2px solid var(--red-seal);
      padding: 4px 8px;
      transform: rotate(12deg);
      border-radius: 3px;
      opacity: .8
    }

    body.night-mode .diagnosis-card::after {
      color: #5a8a5a;
      border-color: #5a8a5a
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(201, 169, 110, .2)
    }

    .card-food-icon {
      font-size: 2rem
    }

    .card-food-name {
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
      font-size: 1.4rem;
      color: var(--gold-light);
      letter-spacing: .1em
    }

    .card-category {
      font-size: .7rem;
      color: var(--text-secondary);
      opacity: .5;
      margin-left: auto;
      letter-spacing: .1em
    }

    .card-time-judgement {
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
      font-size: .95rem;
      color: var(--red-bright);
      line-height: 1.8;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: rgba(139, 26, 26, .06);
      border-left: 3px solid rgba(139, 26, 26, .4);
      border-radius: 0 4px 4px 0
    }

    body.night-mode .card-time-judgement {
      color: #8ab88a;
      background: rgba(58, 90, 58, .1);
      border-left-color: rgba(58, 90, 58, .5)
    }

    .card-diagnosis {
      font-size: .9rem;
      color: var(--text-primary);
      line-height: 1.9;
      margin-bottom: 8px;
      white-space: pre-wrap
    }

    .card-mood-tag {
      display: inline-block;
      font-size: .7rem;
      padding: 2px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      opacity: .6;
      letter-spacing: .1em
    }

    .card-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
      font-size: .95rem;
      cursor: pointer;
      letter-spacing: .1em;
      transition: all var(--transition-medium);
      background: transparent;
      color: var(--gold);
      text-align: center
    }

    .btn:hover {
      background: rgba(201, 169, 110, .08);
      border-color: var(--gold)
    }

    .btn.primary {
      background: rgba(201, 169, 110, .12);
      border-color: var(--gold)
    }

    .btn.primary:hover {
      background: rgba(201, 169, 110, .2)
    }

    .btn.danger {
      border-color: rgba(139, 26, 26, .5);
      color: var(--red-bright)
    }

    .btn.danger:hover {
      background: rgba(139, 26, 26, .08);
      border-color: var(--red-bright)
    }

    .btn.save {
      flex: 0 1 auto;
      min-width: 110px;
      border-color: rgba(201, 169, 110, .35);
      color: var(--gold-light);
      white-space: nowrap;
    }

    .btn.save:hover {
      background: rgba(201, 169, 110, .1);
      border-color: var(--gold);
    }

    .btn.save:disabled {
      opacity: .4;
      pointer-events: none;
    }

    /* Food count badge */
    .food-count-badge {
      font-size: .65rem;
      color: var(--text-secondary);
      opacity: .4;
      text-align: center;
      letter-spacing: .1em;
      margin-top: -8px
    }

    /* Sin Scroll */
    .sin-scroll {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 30, 40, .9);
      border: 1px solid rgba(139, 26, 26, .4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      opacity: 0;
      transform: scale(0);
      transition: all .5s cubic-bezier(.175, .885, .32, 1.275);
      box-shadow: 0 0 20px rgba(139, 26, 26, .2)
    }

    .sin-scroll.visible {
      opacity: 1;
      transform: scale(1)
    }

    .sin-scroll:hover {
      border-color: var(--red-bright);
      box-shadow: 0 0 30px rgba(139, 26, 26, .4)
    }

    .sin-scroll-icon {
      font-size: 1.2rem
    }

    .sin-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      background: var(--red-bright);
      border-radius: 50%;
      font-size: .65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold
    }

    .sin-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .8);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-medium)
    }

    .sin-modal.open {
      opacity: 1;
      pointer-events: auto
    }

    .sin-modal-content {
      background: #1a1a28;
      border: 2px solid var(--red-seal);
      border-radius: 8px;
      padding: 32px 24px;
      max-width: 400px;
      width: 90%;
      max-height: 70vh;
      overflow-y: auto;
      position: relative
    }

    .sin-modal-title {
      font-family: 'STKaiti', 'KaiTi', serif;
      font-size: 1.3rem;
      color: var(--red-bright);
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: .15em
    }

    .sin-list {
      list-style: none
    }

    .sin-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      font-size: .85rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .sin-item-time {
      font-size: .7rem;
      opacity: .5
    }

    .sin-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer
    }

    /* Letter */
    .letter-trigger {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 30, 40, .9);
      border: 1px solid rgba(201, 169, 110, .3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all var(--transition-medium)
    }

    .letter-trigger:hover {
      border-color: var(--gold);
      box-shadow: 0 0 30px rgba(201, 169, 110, .25)
    }

    .letter-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .8);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-medium)
    }

    .letter-modal.open {
      opacity: 1;
      pointer-events: auto
    }

    .letter-content {
      background: #1a1a28;
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 32px 24px;
      max-width: 400px;
      width: 90%;
      text-align: center
    }

    .letter-input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: .95rem;
      text-align: center;
      margin: 16px 0;
      outline: none
    }

    .letter-input:focus {
      border-color: var(--gold)
    }

    /* Strike */
    .strike-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .9);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-slow)
    }

    .strike-overlay.active {
      opacity: 1;
      pointer-events: auto
    }

    .strike-note {
      text-align: center;
      padding: 40px
    }

    .strike-note h2 {
      font-family: 'STKaiti', 'KaiTi', serif;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: 12px
    }

    .strike-note p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.8
    }

    .strike-note .emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 20px
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: #1a1a28;
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      padding: 12px 24px;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: all .4s cubic-bezier(.175, .885, .32, 1.275);
      font-family: 'STKaiti', 'KaiTi', serif;
      font-size: .9rem;
      color: var(--gold-light);
      box-shadow: var(--shadow-gold);
      max-width: 90vw
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1
    }

    /* Ghost face */
    .ghost-face {
      position: fixed;
      pointer-events: none;
      z-index: 5;
      font-size: 2rem;
      opacity: 0;
      animation: ghostFloat 3s ease-in-out forwards
    }

    @keyframes ghostFloat {
      0% {
        opacity: 0;
        transform: translateY(0) scale(.5)
      }

      15% {
        opacity: .7;
        transform: translateY(-20px) scale(1)
      }

      30% {
        opacity: 1;
        transform: translateY(-40px) scale(1.1)
      }

      70% {
        opacity: .6;
        transform: translateY(-80px) scale(.9)
      }

      100% {
        opacity: 0;
        transform: translateY(-120px) scale(.3)
      }
    }

    /* iOS 摇签权限按钮 */
    .shake-permission-btn {
      display: inline-block;
      padding: 14px 32px;
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      background: rgba(30, 30, 40, 0.85);
      color: var(--gold);
      font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition-medium);
      box-shadow: 0 0 24px rgba(201, 169, 110, 0.12);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .shake-permission-btn:hover,
    .shake-permission-btn:active {
      background: rgba(201, 169, 110, 0.1);
      border-color: var(--gold);
      box-shadow: 0 0 36px rgba(201, 169, 110, 0.25);
    }

    .shake-permission-btn.removing {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }


    /* Responsive */
    @media(max-width:420px) {
      .app-container {
        padding: 16px 12px;
        gap: 16px
      }

      .temple-title {
        font-size: 1.6rem
      }

      .tube-stage {
        width: 160px;
        height: 240px
      }

      .tube {
        width: 80px;
        height: 180px
      }

      .tube-base {
        width: 100px
      }

      .diagnosis-card {
        padding: 20px 16px
      }

      .card-actions {
        flex-direction: column
      }
    }

    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(201, 169, 110, .2);
      border-radius: 2px
    }
  </style>

      if (!audio) return;
      audio.currentTime = 0;
      audio.play().catch(() => { });
    }

    function unlockAllAudio() {
      Object.values(_sfx).forEach(a => {
        a.volume = 0;
        a.play().then(() => { a.pause(); a.currentTime = 0; a.volume = 1; }).catch(() => { });
      });
    }

    // ═══════════════════════════════════════════
    //  DOM 引用
    // ═══════════════════════════════════════════
    const $ = id => document.getElementById(id);
    const tube = $('tube');
    const flyingStick = $('flyingStick');
    const stickHeads = $('stickHeads');
    const diagnosisCard = $('diagnosisCard');
    const hintText = $('hintText');
    const sinScroll = $('sinScroll');
    const sinBadge = $('sinBadge');
    const sinList = $('sinList');
    const sinModal = $('sinModal');
    const letterModal = $('letterModal');
    const letterInput = $('letterInput');
    const letterMessage = $('letterMessage');
    const strikeOverlay = $('strikeOverlay');
    const moodIndicator = $('moodIndicator');
    const godName = $('godName');
    const templeTitle = $('templeTitle');
    const toast = $('toast');
    const cardFoodIcon = $('cardFoodIcon');
    const cardFoodName = $('cardFoodName');
    const cardCategory = $('cardCategory');
    const cardTimeJudgement = $('cardTimeJudgement');
    const cardDiagnosis = $('cardDiagnosis');
    const cardMoodTag = $('cardMoodTag');
    const foodCountBadge = $('foodCountBadge');

    // ═══════════════════════════════════════════
    //  初始化
    // ═══════════════════════════════════════════
    function init() {
      loadState();
      detectTimePeriod();
      determineMood();
      renderInitialUI();
      generateStickHeads();
      bindEvents();

      if (state.mood.name === 'strike') showStrike();

      if (state.timePeriod === 'night') {
        const hour = new Date().getHours();
        if (hour >= 23 || hour < 5) {
          document.body.classList.add('night-mode');
          godName.textContent = '—— 饿鬼道引路人 · 深夜审判 ——';
          if (Math.random() < 0.3) setTimeout(spawnGhostFace, 3000 + Math.random() * 5000);
        }
      }

      updateSinScroll();

      if (state.godLetterName && state.consecutiveDays >= 1) {
        setTimeout(() => {
          showToast(`哦，你就是昨天那个非要给神写信的「${state.godLetterName}」对吧？神记住你了。`);
        }, 1500);
      }
    }

    // ═══════════════════════════════════════════
    //  localStorage 持久化
    // ═══════════════════════════════════════════
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem('food_oracle_state') || '{}');
        state.antiCommandCount = saved.antiCommandCount || 0;
        state.consecutiveDays = saved.consecutiveDays || 0;
        state.lastVisitDate = saved.lastVisitDate || null;
        state.godLetterName = saved.godLetterName || null;
        state.sinRecords = saved.sinRecords || [];
        state.poisonModeUnlocked = saved.poisonModeUnlocked || false;

        const today = new Date().toDateString();
        if (state.lastVisitDate) {
          const yesterday = new Date(Date.now() - 86400000).toDateString();
          if (state.lastVisitDate === yesterday) state.consecutiveDays++;
          else if (state.lastVisitDate !== today) state.consecutiveDays = 1;
        } else {
          state.consecutiveDays = 1;
        }
        state.lastVisitDate = today;

        if (state.consecutiveDays >= 3 && !state.poisonModeUnlocked) {
          state.poisonModeUnlocked = true;
          setTimeout(() => showToast('你诚意够了——「毒舌模式」已免费开放一周。想听真话吗？'), 2000);
        }
        saveState();
      } catch (e) {
        state.antiCommandCount = 0; state.sinRecords = [];
      }
    }

    function saveState() {
      localStorage.setItem('food_oracle_state', JSON.stringify({
        antiCommandCount: state.antiCommandCount,
        consecutiveDays: state.consecutiveDays,
        lastVisitDate: state.lastVisitDate,
        godLetterName: state.godLetterName,
        sinRecords: state.sinRecords,
        poisonModeUnlocked: state.poisonModeUnlocked
      }));
    }

    // ═══════════════════════════════════════════
    //  时间检测（静默，不告知用户）
    // ═══════════════════════════════════════════
    function detectTimePeriod() {
      const h = new Date().getHours();
      if (h < 10) state.timePeriod = TIME_PERIODS.MORNING;
      else if (h < 14) state.timePeriod = TIME_PERIODS.NOON;
      else if (h < 20) state.timePeriod = TIME_PERIODS.EVENING;
      else state.timePeriod = TIME_PERIODS.NIGHT;
    }

    // ═══════════════════════════════════════════
    //  神明情绪（按日期种子确定，全天一致）
    // ═══════════════════════════════════════════
    function determineMood() {
      const seed = new Date().toDateString().split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      const r = (seed % 100) / 100;
      if (r < 0.05) state.mood = MOODS.STRIKE;
      else if (r < 0.18) state.mood = MOODS.ANGRY;
      else if (r < 0.30) state.mood = MOODS.EMO;
      else if (r < 0.40) state.mood = MOODS.CHUUNIBYOU;
      else state.mood = MOODS.NORMAL;
    }

    // ═══════════════════════════════════════════
    //  初始 UI 渲染
    // ═══════════════════════════════════════════
    function renderInitialUI() {
      moodIndicator.textContent = state.mood.label;
      foodCountBadge.textContent = `签筒中共有 ${FOOD_DATABASE.length} 种食物等待审判你`;

      if (state.mood.name === 'angry') {
        moodIndicator.style.borderColor = '#c42b2b'; moodIndicator.style.color = '#c42b2b';
      } else if (state.mood.name === 'emo') {
        moodIndicator.style.borderColor = '#6a8abf'; moodIndicator.style.color = '#6a8abf';
      } else if (state.mood.name === 'chuunibyou') {
        moodIndicator.style.borderColor = '#c97a2e'; moodIndicator.style.color = '#c97a2e';
      }
    }

    function generateStickHeads() {
      stickHeads.innerHTML = '';
      for (let i = 0; i < 28; i++) {
        const s = document.createElement('div');
        s.className = 'stick-head';
        s.style.transform = `rotate(${(Math.random() - 0.5) * 15}deg)`;
        stickHeads.appendChild(s);
      }
    }

    // ═══════════════════════════════════════════
    //  事件绑定（含 iOS 13+ DeviceOrientation 权限）
    // ═══════════════════════════════════════════
    let _shakeBound = false;

    function attachShakeListener() {
      if (_shakeBound) return;
      _shakeBound = true;
      let lastShake = 0, lx = 0, ly = 0, lz = 0;
      window.addEventListener('devicemotion', (e) => {
        const a = e.accelerationIncludingGravity;
        if (!a) return;
        const d = Math.abs(a.x - lx) + Math.abs(a.y - ly) + Math.abs(a.z - lz);
        if (d > 30 && Date.now() - lastShake > 2000 && !state.isDrawing && state.mood.name !== 'strike') {
          lastShake = Date.now(); drawFortune();
        }
        lx = a.x; ly = a.y; lz = a.z;
      });
    }

    function unlockIOSAudio() {
      unlockAllAudio();
    }


    function bindEvents() {
      tube.addEventListener('click', () => {
        if (state.isDrawing || state.mood.name === 'strike') return;
        unlockAllAudio();
        drawFortune();
      });

      const needsPermission = (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
      );

      if (needsPermission) {
        // iOS 13+：需要用户显式授权
        const btn = document.getElementById('shakePermissionBtn');
        if (btn) {
          btn.style.display = 'inline-block';
          btn.addEventListener('click', async () => {
            try {
              const perm = await DeviceOrientationEvent.requestPermission();
              if (perm === 'granted') {
                attachShakeListener();
                unlockIOSAudio();
                btn.classList.add('removing');
                setTimeout(() => { btn.style.display = 'none'; btn.classList.remove('removing'); }, 400);
                showToast('签筒已开启——摇晃手机求签吧');
              } else {
                showToast('食神无法感知你的动作……请点击签筒求签');
              }
            } catch (e) {
              showToast('叩拜失败……请直接点击签筒求签吧');
            }
          });
        }
      } else {
        // 安卓 / 旧 iOS / 桌面端：直接绑定
        if (window.DeviceMotionEvent) {
          attachShakeListener();
        }
      }
    }


    // ═══════════════════════════════════════════
    //  核心：求签
    // ═══════════════════════════════════════════
    function drawFortune() {
      if (state.isDrawing) return;
      state.isDrawing = true;

      diagnosisCard.classList.remove('revealed');
      hintText.style.opacity = '0.3';
      tube.classList.add('shaking');
      playSfx('shake');



      const food = FOOD_DATABASE[Math.floor(Math.random() * FOOD_DATABASE.length)];
      state.currentFood = food;

      setTimeout(() => {
        tube.classList.remove('shaking');
        flyingStick.classList.add('active');
        playSfx('stickDrop');

        setTimeout(() => {
          flyingStick.classList.remove('active');


          revealDiagnosis(food);
          state.isDrawing = false;
          hintText.style.opacity = '0.7';
        }, 1000);
      }, 600);
    }

    // ═══════════════════════════════════════════
    //  揭示诊断书
    // ═══════════════════════════════════════════
    function revealDiagnosis(food) {
      const timeJudge = food.time_judgement[state.timePeriod];
      let diagnosis = food.diagnosis;
      let moodTag = '';

      // 情绪滤镜
      if (state.mood.name === 'angry') {
        diagnosis = '💢 ' + food.angry_bonus + '\n\n' + diagnosis;
        moodTag = '⚡ 暴躁日特别版';
      } else if (state.mood.name === 'emo') {
        diagnosis = '（食神今日心情低落，但依然为你解签……）\n\n' + diagnosis;
        moodTag = '🌧️ emo日 · 温柔版';
      } else if (state.mood.name === 'chuunibyou') {
        diagnosis = '哼，凡人，这就是你的宿命之食！解开它的封印，你将获得下午摸鱼三小时的秘奥义！\n\n' + diagnosis;
        moodTag = '🔥 中二病发作版';
      }

      // 深夜鬼食模式
      if (state.timePeriod === 'night') {
        const h = new Date().getHours();
        if (h >= 23 || h < 5) {
          diagnosis = '这个时辰还在找吃的，你不是饿，你是心里有一个填不满的洞。来吧，无论抽到什么，今晚它都是你的灵魂镇痛剂，不是食物。\n\n' + diagnosis;
        }
      }

      // 署名用户彩蛋
      if (state.godLetterName && Math.random() < 0.5) {
        diagnosis = `（食神瞥了一眼签筒旁的卷轴——「${state.godLetterName}」，又是你。）\n\n` + diagnosis;
      }

      // 毒舌模式彩蛋
      if (state.poisonModeUnlocked && Math.random() < 0.4) {
        diagnosis += '\n\n🔥 毒舌模式附赠：「说真的，你抽签之前心里已经有答案了吧？你只是想找个人替你背锅。行，本神背了。」';
      }

      // 记仇文案：上次抗旨的后果
      if (state.lastRejectedFood) {
        const grudgeTemplates = [
          `⚡ 上次你拒绝了「{food}」，神记着呢。这次给神老实点。`,
          `📜 神的案卷上写着：此人曾拒「{food}」。你还有一次赎罪的机会。`,
          `💢 想起你上次拒绝「{food}」，神的手还在抖。今天别再犯。`,
          `🔮 本神掐指一算——你上次拒了「{food}」，罪业未消。这签是给你赎罪的。`,
          `⚔️ 上次「{food}」你不吃，这次神换了一个。但别以为神忘了——罪状还在卷轴上。`,
          `😤 「{food}」事件尚未翻篇。食神虽然宽宏大量，但这笔账还没销。`,
          `🪷 抗旨一次情有可原，但上次拒绝「{food}」这件事——神今天要你补回来。`,
          `🔥 食神翻开记仇小本本：第1条就是拒绝「{food}」。今天这签你若再拒——后果自负。`
        ];
        const grudge = grudgeTemplates[Math.floor(Math.random() * grudgeTemplates.length)]
          .replace('{food}', state.lastRejectedFood);
        diagnosis = grudge + '\n\n' + diagnosis;
        state.lastRejectedFood = null;
        saveState();
      }


      // 填充 DOM
      cardFoodIcon.textContent = food.icon;
      cardFoodName.textContent = food.name;
      cardCategory.textContent = food.category;
      cardTimeJudgement.textContent = timeJudge;
      cardDiagnosis.textContent = diagnosis;
      cardMoodTag.textContent = moodTag;

      setTimeout(() => {
        diagnosisCard.classList.add('revealed');
        const saveBtn = document.getElementById('btnSave');
        if (saveBtn) saveBtn.disabled = false;

        playSfx('reveal');
      }, 100);

    }
    // ═══════════════════════════════════════════
    //  截图分享
    // ═══════════════════════════════════════════
    async function saveFortuneAsImage() {
      const card = document.getElementById('diagnosisCard');
      const btn = document.getElementById('btnSave');
      if (!card || !card.classList.contains('revealed')) return;

      btn.disabled = true;
      btn.textContent = '⏳ 渲染中...';

      try {
        const canvas = await html2canvas(card, {
          backgroundColor: '#14141f',
          scale: 2,
          useCORS: true,
          allowTaint: true
        });

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], '食神签.png', { type: 'image/png' });

        // 移动端：系统分享面板
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: '食神签 · 今日诊断',
            text: '食神签 · 今日诊断',
            files: [file]
          });
          showToast('📋 签文已分享！');
        } else {
          // 桌面端 & 不支持 share 的移动端：下载
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = '食神签.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('📋 签文已保存！');
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          showToast('⚠️ 保存失败，请手动截图');
          console.error('saveFortuneAsImage:', e);
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '📋 保存签文';
      }
    }

    // ═══════════════════════════════════════════
    //  从命
    // ═══════════════════════════════════════════
    function acceptFortune() {
      const food = state.currentFood;
      if (!food) return;


      const praises = [
        `🙏 你从了食神的旨意。去吃${food.name}吧，神会保佑你的胃。`,
        `🙏 明智的选择。${food.name}已经在等你了——别让它等太久。`,
        `🙏 食神点头：识时务者为俊杰。今天这顿${food.name}，神给你免辣。`
      ];
      showToast(praises[Math.floor(Math.random() * praises.length)]);

      setTimeout(() => {
        generateStickHeads();
        diagnosisCard.classList.remove('revealed');
      }, 800);
    }

    // ═══════════════════════════════════════════
    //  抗旨
    // ═══════════════════════════════════════════
    function rejectFortune() {
      const food = state.currentFood;
      if (!food) return;
      playSfx('reject');
      state.lastRejectedFood = food.name;



      state.antiCommandCount++;
      state.sinRecords.push({
        food: food.name, icon: food.icon,
        time: new Date().toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
        mood: state.mood.label
      });
      saveState();
      updateSinScroll();

      let msg;
      if (state.mood.name === 'angry') {
        msg = '💢 大胆！！今日食神暴躁你还敢抗旨？！罪加一等！！';
      } else if (state.mood.name === 'emo') {
        msg = '😔 连你也拒绝神……也罢，神已经习惯了被辜负。';
      } else if (state.mood.name === 'chuunibyou') {
        msg = '⚔️ 哼！竟敢违抗本神之命！你的反叛意志已被记录在暗黑卷轴之上！';
      } else {
        const replies = [
          `⚔️ 你拒绝了${food.name}。食神摇摇头，在小本本上记了一笔。`,
          `⚔️ 抗旨！食神眉毛一挑：行，你有种。但神会记住的。`,
          `⚔️ 竟敢抗旨？食神冷笑：你的罪状+1，凑满三条会有惊喜。`
        ];
        msg = replies[Math.floor(Math.random() * replies.length)];
      }
      showToast(msg);

      // 锁定签筒 2 秒
      const tubeEl = document.getElementById('tube');
      const angerText = document.getElementById('angerText');
      tubeEl.classList.add('locked');
      if (angerText) {
        angerText.textContent = '神生气了，稍等片刻……';
        angerText.classList.add('show');
      }

      setTimeout(() => {
        tubeEl.classList.remove('locked');
        if (angerText) angerText.classList.remove('show');
        generateStickHeads();
        diagnosisCard.classList.remove('revealed');
      }, 2000);

    }

    // ═══════════════════════════════════════════
    //  记仇小本本
    // ═══════════════════════════════════════════
    function updateSinScroll() {
      sinBadge.textContent = state.sinRecords.length;
      sinScroll.classList.toggle('visible', state.sinRecords.length >= 3);
    }

    function openSinScroll() {
      sinList.innerHTML = state.sinRecords.map((r, i) => `
    <li class="sin-item">
      <span>${r.icon} 第${i + 1}条：拒绝「${r.food}」</span>
      <span class="sin-item-time">${r.time}</span>
    </li>
  `).reverse().join('');
      sinModal.classList.add('open');
    }

    function closeSinScroll(e) {
      if (e.target === sinModal) sinModal.classList.remove('open');
    }

    function closeSinScrollDirect() {
      sinModal.classList.remove('open');
    }

    // ═══════════════════════════════════════════
    //  食神的信
    // ═══════════════════════════════════════════
    function openLetterModal() {
      letterMessage.textContent = state.godLetterName
        ? `「${state.godLetterName}」——神认得你了。想换个名号吗？`
        : '在此留下你的名号（不必是真名），食神会记住你。';
      letterInput.value = '';
      letterModal.classList.add('open');
    }

    function closeLetterModal(e) {
      if (e.target === letterModal) letterModal.classList.remove('open');
    }

    function closeLetterModalDirect() {
      letterModal.classList.remove('open');
    }

    function submitLetter() {
      const name = letterInput.value.trim();
      if (!name) { showToast('不写名号？神怎么记住你？'); return; }
      state.godLetterName = name;
      saveState();
      letterModal.classList.remove('open');
      showToast(`「${name}」——本神不识字，不会写信。但明天午时再来，心里默念你的名号，神会认出你。`);
    }

    // ═══════════════════════════════════════════
    //  罢工日
    // ═══════════════════════════════════════════
    function showStrike() {
      strikeOverlay.classList.add('active');
    }

    // ═══════════════════════════════════════════
    //  深夜鬼脸彩蛋
    // ═══════════════════════════════════════════
    function spawnGhostFace() {
      const ghost = document.createElement('div');
      ghost.className = 'ghost-face';
      ghost.textContent = ['👻', '💀', '🕯️', '😈'][Math.floor(Math.random() * 4)];
      ghost.style.left = (10 + Math.random() * 80) + '%';
      ghost.style.top = (55 + Math.random() * 35) + '%';
      document.body.appendChild(ghost);
      setTimeout(() => ghost.remove(), 3500);
      if (Math.random() < 0.3) setTimeout(spawnGhostFace, 5000 + Math.random() * 8000);
    }

    // ═══════════════════════════════════════════
    //  Toast 提示
    // ═══════════════════════════════════════════
    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ═══════════════════════════════════════════
    //  启动
    // ═══════════════════════════════════════════
    init();

    console.log('🥢 野生食神签 · 百味审判已就绪');
    console.log('   签筒中共有', FOOD_DATABASE.length, '种食物');
    console.log('   当前时段:', state.timePeriod);
    console.log('   今日神谕:', state.mood.label);
    console.log('   连续签到:', state.consecutiveDays, '天 | 抗旨次数:', state.antiCommandCount);
    console.log('   📿 点击签筒或摇晃手机求签');
  </script>
</body>
